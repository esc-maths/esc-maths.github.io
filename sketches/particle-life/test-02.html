<!DOCTYPE html>
<html lang="en">
<head>
    <title>GPGPU Particle Life - Lab</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <style>
        body { background-color: #000; margin: 0; overflow: hidden; font-family: sans-serif; }
        
        /* Sidebar styling */
        #gui-container {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            z-index: 10;
            transition: transform 0.3s ease;
        }
        #gui-container.closed {
            transform: translateX(-245px); /* Hide most of the GUI */
        }
        
        #toggle-btn {
            position: absolute;
            top: 10px;
            left: 255px;
            background: rgba(0,0,0,0.8);
            color: white;
            border: 1px solid #444;
            padding: 8px 12px;
            cursor: pointer;
            pointer-events: auto;
            border-radius: 4px;
        }

        canvas { display: block; }
    </style>
</head>
<body>
    <div id="gui-container">
        <button id="toggle-btn">Menu</button>
        <div id="gui-mount"></div>
    </div>

    <script id="fragmentShaderPosition" type="x-shader/x-fragment">
        uniform vec2 worldSize;
        void main() {
            vec2 uv = gl_FragCoord.xy / resolution.xy;
            vec4 tmpPos = texture2D( texturePosition, uv );
            vec3 pos = tmpPos.xyz;
            vec3 vel = texture2D( textureVelocity, uv ).xyz;
            pos += vel;
            vec2 halfSize = worldSize * 0.5;
            if (pos.x < -halfSize.x) pos.x += worldSize.x;
            if (pos.x >  halfSize.x) pos.x -= worldSize.x;
            if (pos.y < -halfSize.y) pos.y += worldSize.y;
            if (pos.y >  halfSize.y) pos.y -= worldSize.y;
            gl_FragColor = vec4( pos, tmpPos.w );
        }
    </script>

    <script id="fragmentShaderVelocity" type="x-shader/x-fragment">
        uniform vec2 worldSize;
        uniform sampler2D textureMatrixForces;
        uniform sampler2D textureMatrixRadii;
        uniform float friction;
        uniform float forceScale;
        
        const float NUM_TYPES = 6.0;

        void main() {
            vec2 uv = gl_FragCoord.xy / resolution.xy;
            vec4 selfData = texture2D( texturePosition, uv );
            vec3 selfPos = selfData.xyz;
            float selfType = selfData.w;
            vec3 selfVel = texture2D( textureVelocity, uv ).xyz;

            vec3 force = vec3( 0.0 );

            for ( float y = 0.0; y < resolution.y; y++ ) {
                for ( float x = 0.0; x < resolution.x; x++ ) {
                    vec2 ref = vec2( x + 0.5, y + 0.5 ) / resolution.xy;
                    vec4 otherData = texture2D( texturePosition, ref );
                    vec3 otherPos = otherData.xyz;
                    float otherType = otherData.w;

                    vec3 dir = otherPos - selfPos;
                    if (dir.x >  worldSize.x * 0.5) dir.x -= worldSize.x;
                    if (dir.x < -worldSize.x * 0.5) dir.x += worldSize.x;
                    if (dir.y >  worldSize.y * 0.5) dir.y -= worldSize.y;
                    if (dir.y < -worldSize.y * 0.5) dir.y += worldSize.y;

                    float dist = length( dir );

                    if ( dist > 0.1 && dist < 200.0 ) {
                        vec2 lookupUV = vec2( (selfType + 0.5) / NUM_TYPES, (otherType + 0.5) / NUM_TYPES );
                        float forceVal = texture2D( textureMatrixForces, lookupUV ).r;
                        float radius = texture2D( textureMatrixRadii, lookupUV ).r;
                        float minDist = 25.0;

                        if ( dist < minDist ) {
                            force += normalize(dir) * (abs(forceVal) * -4.0 * (1.0 - dist / minDist));
                        } else if ( dist < radius ) {
                            force += normalize(dir) * (forceVal * (1.0 - dist / radius));
                        }
                    }
                }
            }

            vec3 velocity = (selfVel + force * forceScale) * friction;
            float speed = length(velocity);
            if (speed > 5.0) velocity = normalize(velocity) * 5.0;

            gl_FragColor = vec4( velocity, 1.0 );
        }
    </script>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.179.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.179.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GPUComputationRenderer } from 'three/addons/misc/GPUComputationRenderer.js';
        import { GUI } from 'three/addons/libs/lil-gui.module.min.js';

        let camera, scene, renderer, gpuCompute, points;
        let velocityVariable, positionVariable;
        let forceMatrixTex, radiiMatrixTex;
        let worldSize = new THREE.Vector2(window.innerWidth, window.innerHeight);
        const NUM_TYPES = 6;

        // Settings for the Menu
        const settings = {
            particleRes: 100, // 100x100 = 10k
            friction: 0.25,
            forceScale: 0.05,
            pointSize: 4,
            randomize: () => randomizeRules(),
            rebuild: () => initSystem()
        };

        init();

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.OrthographicCamera(-window.innerWidth/2, window.innerWidth/2, window.innerHeight/2, -window.innerHeight/2, 1, 1000);
            camera.position.z = 10;

            renderer = new THREE.WebGLRenderer({ antialias: false });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setAnimationLoop(animate);
            document.body.appendChild(renderer.domElement);

            initGUI();
            initSystem();

            window.addEventListener('resize', onWindowResize);
            document.getElementById('toggle-btn').onclick = () => {
                document.getElementById('gui-container').classList.toggle('closed');
            };
        }

        function initGUI() {
            const gui = new GUI({ container: document.getElementById('gui-mount'), width: 250 });
            gui.add(settings, 'particleRes', 32, 120, 1).name('Resolution (NxN)').onFinishChange(settings.rebuild);
            gui.add(settings, 'friction', 0.1, 0.99).name('Friction');
            gui.add(settings, 'forceScale', 0.01, 0.2).name('Force K');
            gui.add(settings, 'pointSize', 1.0, 10.0).name('Point Size').onChange(v => {
                if(points) points.material.uniforms.pointSize.value = v;
            });
            gui.add(settings, 'randomize').name('Randomize Rules');
            gui.add(settings, 'rebuild').name('Apply New Particle Count');
        }

        function initSystem() {
            // Clean up existing
            if (points) {
                scene.remove(points);
                points.geometry.dispose();
                points.material.dispose();
            }

            const size = settings.particleRes;
            gpuCompute = new GPUComputationRenderer(size, size, renderer);

            const dtPos = gpuCompute.createTexture();
            const dtVel = gpuCompute.createTexture();
            fillTextures(dtPos, dtVel);

            velocityVariable = gpuCompute.addVariable('textureVelocity', document.getElementById('fragmentShaderVelocity').textContent, dtVel);
            positionVariable = gpuCompute.addVariable('texturePosition', document.getElementById('fragmentShaderPosition').textContent, dtPos);

            gpuCompute.setVariableDependencies(velocityVariable, [positionVariable, velocityVariable]);
            gpuCompute.setVariableDependencies(positionVariable, [positionVariable, velocityVariable]);

            // Add Uniforms
            velocityVariable.material.uniforms.worldSize = { value: worldSize };
            velocityVariable.material.uniforms.friction = { value: settings.friction };
            velocityVariable.material.uniforms.forceScale = { value: settings.forceScale };
            positionVariable.material.uniforms.worldSize = { value: worldSize };

            forceMatrixTex = new THREE.DataTexture(new Float32Array(NUM_TYPES * NUM_TYPES * 4), NUM_TYPES, NUM_TYPES, THREE.RGBAFormat, THREE.FloatType);
            radiiMatrixTex = new THREE.DataTexture(new Float32Array(NUM_TYPES * NUM_TYPES * 4), NUM_TYPES, NUM_TYPES, THREE.RGBAFormat, THREE.FloatType);
            randomizeRules();

            velocityVariable.material.uniforms.textureMatrixForces = { value: forceMatrixTex };
            velocityVariable.material.uniforms.textureMatrixRadii = { value: radiiMatrixTex };

            gpuCompute.init();

            // Setup Rendering Points
            const geometry = new THREE.BufferGeometry();
            const uvs = new Float32Array(size * size * 2);
            for (let i = 0; i < size * size; i++) {
                uvs[i * 2] = (i % size) / size;
                uvs[i * 2 + 1] = Math.floor(i / size) / size;
            }
            geometry.setAttribute('reference', new THREE.BufferAttribute(uvs, 2));
            geometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array(size * size * 3), 3));

            const material = new THREE.ShaderMaterial({
                uniforms: { 
                    texturePosition: { value: null },
                    pointSize: { value: settings.pointSize }
                },
                vertexShader: `
                    uniform sampler2D texturePosition;
                    uniform float pointSize;
                    attribute vec2 reference;
                    varying vec3 vColor;
                    void main() {
                        vec4 data = texture2D(texturePosition, reference);
                        vColor = vec3(0.5 + 0.5 * cos(6.28 * (data.w / 6.0 + vec3(0,0.33,0.67))));
                        gl_PointSize = pointSize;
                        gl_Position = projectionMatrix * modelViewMatrix * vec4(data.xyz, 1.0);
                    }
                `,
                fragmentShader: `
                    varying vec3 vColor;
                    void main() {
                        if (length(gl_PointCoord - 0.5) > 0.5) discard;
                        gl_FragColor = vec4(vColor, 1.0);
                    }
                `,
                transparent: true,
                blending: THREE.AdditiveBlending
            });

            points = new THREE.Points(geometry, material);
            scene.add(points);
        }

        function fillTextures(tPos, tVel) {
            const arrPos = tPos.image.data;
            for (let i = 0; i < arrPos.length; i += 4) {
                arrPos[i] = Math.random() * worldSize.x - worldSize.x/2;
                arrPos[i+1] = Math.random() * worldSize.y - worldSize.y/2;
                arrPos[i+3] = Math.floor(Math.random() * NUM_TYPES);
            }
        }

        function randomizeRules() {
            const fD = forceMatrixTex.image.data;
            const rD = radiiMatrixTex.image.data;
            for (let i = 0; i < NUM_TYPES * NUM_TYPES; i++) {
                fD[i * 4] = (Math.random() * 2 - 1);
                rD[i * 4] = Math.random() * 150 + 50;
            }
            forceMatrixTex.needsUpdate = true;
            radiiMatrixTex.needsUpdate = true;
        }

        function onWindowResize() {
            worldSize.set(window.innerWidth, window.innerHeight);
            camera.left = -window.innerWidth/2; camera.right = window.innerWidth/2;
            camera.top = window.innerHeight/2; camera.bottom = -window.innerHeight/2;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            if(positionVariable) {
                positionVariable.material.uniforms.worldSize.value = worldSize;
                velocityVariable.material.uniforms.worldSize.value = worldSize;
            }
        }

        function animate() {
            velocityVariable.material.uniforms.friction.value = settings.friction;
            velocityVariable.material.uniforms.forceScale.value = settings.forceScale;
            gpuCompute.compute();
            points.material.uniforms.texturePosition.value = gpuCompute.getCurrentRenderTarget(positionVariable).texture;
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
