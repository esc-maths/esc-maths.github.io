<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Number Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Random Generator</h1>
        
        <div class="mode-selector">
            <label>
                <input type="radio" name="mode" value="range" checked> Range
            </label>
            <label>
                <input type="radio" name="mode" value="set"> Specific Set
            </label>
        </div>
        
        <div id="range-inputs">
            <div class="input-group">
                <label for="min">From:</label>
                <input type="number" id="min" value="1" min="1" step="1">
            </div>
            
            <div class="input-group">
                <label for="max">To:</label>
                <input type="number" id="max" value="10" min="1" step="1">
            </div>
        </div>

        <div id="set-inputs" class="hidden">
            <div class="input-group column-layout">
                <label for="number-set">Enter numbers (comma-separated):</label>
                <input type="text" id="number-set" placeholder="e.g., 10, 12, 15, 20">
            </div>
        </div>

        <button id="generateBtn">Generate Number</button>

        <p id="error-message" class="error"></p>

        <div class="result-container">
            <span id="result">-</span>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
