<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Milky Way – Andromeda (Single‑file WebGL N‑body toy)</title>
  <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
  <div id="ui">
    <div class="row">
      <div class="title">Milky Way – Andromeda (toy restricted N‑body)</div>
      <button id="toggle">Pause</button>
      <button id="reset">Reset</button>
      <button id="runtests" title="Run built‑in self‑tests">Run tests</button>
      <button id="auto">Auto‑tune</button>
    </div>
    <div class="row">
      <label>Stars/galaxy <input id="stars" type="number" min="4000" max="120000" step="1000" value="20000" /></label>
      <label>Speed <input id="speed" type="range" min="0.1" max="4" step="0.1" value="1.0" /></label>
      <label>Seed <input id="seed" type="number" value="12345" /></label>
    </div>
    <div class="row small">
      <span>Controls: drag = orbit, wheel/pinch = zoom, right‑drag/Shift‑drag = pan, <b>two‑finger drag = pan (iPad)</b>.</span>
      <span style="margin-left:10px">FPS: <span id="fps">--</span></span>
    </div>
    <div class="row">
      <span class="small">Camera:</span>
      <button id="zoomOut" class="icon-btn" title="Zoom out">−</button>
      <button id="zoomIn"  class="icon-btn" title="Zoom in">+</button>
      <button id="rotL"    class="icon-btn" title="Rotate left">⟲</button>
      <button id="rotR"    class="icon-btn" title="Rotate right">⟳</button>
      <button id="rotU"    class="icon-btn" title="Tilt up">↑</button>
      <button id="rotD"    class="icon-btn" title="Tilt down">↓</button>
      <button id="center"  class="pad"      title="Center on midpoint">Center</button>
      <button id="home"    class="pad"      title="Reset camera">Home</button>
    </div>
    <div class="row"><span id="diag">Diagnostics: not run</span></div>
  </div>
  <div id="err"></div>

  <script src="main.js">
  
  </script>
</body>
</html>
