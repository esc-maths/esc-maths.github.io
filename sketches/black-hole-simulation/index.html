<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Three.js + GLSL Black Hole (single HTML)</title>
  <style>
    html, body { height: 100%; margin: 0; background:#000; }
    #app { position: fixed; inset: 0; }
    .overlay { position: fixed; left: 12px; bottom: 12px; color: #9aa0a6; font: 12px/1.3 system-ui; opacity: .9; }
    .overlay b { color:#e8eaed; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.179.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.179.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="app"></div>
  <div class="overlay">GLSL black hole lensing • <b>drag</b> to orbit • <b>scroll</b> to zoom • <b>G</b> toggles GUI</div>
  <script type="module">
    import * as THREE from 'three';
    import { GUI } from 'three/addons/libs/lil-gui.module.min.js';

    const container = document.getElementById('app');
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(container.clientWidth, container.clientHeight);
    container.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

    const uniforms = {
      iTime: { value: 0 },
      iResolution: { value: new THREE.Vector2(renderer.domElement.width, renderer.domElement.height) },
      camPos: { value: new THREE.Vector3(0.0, 0.2, 6.0) },
      camTilt: { value: 0.15 },
      fovY: { value: THREE.MathUtils.degToRad(45) },
      rs: { value: 0.8 },
      steps: { value: 200 },
      h: { value: 0.05 },
      diskRin: { value: 1.6 },
      diskRout: { value: 10.0 },
      diskIncline: { value: 0.35 },
      exposure: { value: 1.0 },
      seed: { value: Math.random() * 1e3 },
      glowIntensity: { value: 0.5 },
      glowRadius: { value: 0.3 },
      diskSmoothness: { value: 0.8 }
    };

    const quad = new THREE.Mesh(
      new THREE.PlaneGeometry(2, 2),
      new THREE.ShaderMaterial({
        uniforms,
        vertexShader: `
          varying vec2 vUv;
          void main() {
            vUv = uv;
            gl_Position = vec4(position.xy, 0.0, 1.0);
          }
        `,
        fragmentShader: `
          precision highp float;
          varying vec2 vUv;
          uniform vec2 iResolution;
          uniform float iTime;
          uniform vec3 camPos;
          uniform float camTilt;
          uniform float fovY;
          uniform float rs;
          uniform int steps;
          uniform float h;
          uniform float diskRin;
          uniform float diskRout;
          uniform float diskIncline;
          uniform float exposure;
          uniform float seed;
          uniform float glowIntensity;
          uniform float glowRadius;
          uniform float diskSmoothness;

          mat3 rotX(float a){ float s = sin(a), c = cos(a); return mat3(1.0,0.0,0.0,  0.0,c,-s,  0.0,s,c); }
          float hash21(vec2 p){ p = fract(p*vec2(123.34, 456.21)); p += dot(p, p+45.32); return fract(p.x*p.y); }
          vec3 tonemap(vec3 x){ x *= exposure; float A=2.51, B=0.03, C=2.43, D=0.59, E=0.14; x = (x*(A*x+B))/(x*(C*x+D)+E); return pow(clamp(x, 0.0, 1.0), vec3(1.0/2.2)); }
          vec3 diskPalette(float rNorm){ vec3 inner = vec3(0.90, 0.95, 1.10); vec3 mid = vec3(1.00, 0.80, 0.55); vec3 outer = vec3(0.60, 0.35, 0.20); return mix(mix(inner, mid, smoothstep(0.0, 0.6, rNorm)), outer, smoothstep(0.6, 1.0, rNorm)); }

          struct Hit { bool hit; vec3 pos; vec3 dir; float t; };
          bool rayPlane(in vec3 ro, in vec3 rd, in vec3 N, in vec3 P0, out float tHit){ float denom = dot(rd, N); if (abs(denom) < 1e-4) return false; float t = dot(P0 - ro, N) / denom; if (t <= 0.0) return false; tHit = t; return true; }

          Hit traceRay(vec3 ro, vec3 rd){
            vec3 pos = ro; vec3 dir = normalize(rd);
            vec3 N = rotX(diskIncline) * vec3(0.0, 1.0, 0.0); vec3 P0 = vec3(0.0);
            float prevSide = dot(pos - P0, N);
            for(int i=0;i<1024;i++){
              if(i>=steps) break;
              float r2 = max(dot(pos,pos), 1e-6);
              float r1 = sqrt(r2);
              if (r1 < rs) return Hit(false, pos, dir, float(i)*h);
              float k = rs * 0.7; vec3 accel = -pos / (r2 * r1 + 1e-6);
              dir = normalize(dir + accel * k * h);
              vec3 prevPos = pos; pos += dir * h;
              float side = dot(pos - P0, N);
              if (side * prevSide < 0.0) {
                float tSeg = abs(prevSide) / (abs(prevSide) + abs(side) + 1e-6);
                vec3 hitPos = mix(pos, prevPos, tSeg);
                vec3 xform = rotX(-diskIncline) * hitPos; float rad = length(xform.xz);
                if (rad > diskRin && rad < diskRout) return Hit(true, hitPos, dir, float(i)*h);
              }
              prevSide = side;
            }
            return Hit(false, pos, dir, float(steps)*h);
          }

          vec3 shadeDisk(vec3 P, vec3 V){
            vec3 Pl = rotX(-diskIncline) * P; float r = length(Pl.xz); float rNorm = clamp((r - diskRin) / (diskRout - diskRin), 0.0, 1.0);
            float phi = atan(Pl.z, Pl.x); vec3 vphi = normalize(vec3(-sin(phi), 0.0, cos(phi)));
            float v = clamp(sqrt(max(rs, 0.0001) / max(r, rs+1e-3)), 0.0, 0.7);
            float beaming = 1.0 + 1.5 * v * max(0.0, dot(vphi, -normalize(V)));
            
            // Smoother disk patterns
            float rings = 0.6 + 0.4 * sin(8.0*log(r+1.1) - 1.5*iTime);
            rings = smoothstep(0.3, 0.7, abs(fract(rings * 0.5) - 0.5)) * 0.8 + 0.2;
            
            float swirl = 0.5 + 0.5 * sin(6.0*phi + 0.8*iTime + 3.14*hash21(vec2(floor(r*2.0), floor(phi*8.0)) + seed));
            swirl = mix(swirl, 1.0, smoothstep(0.7, 1.0, rNorm) * 0.5); // Smoother transition at outer edge
            
            float tex = mix(rings, swirl, 0.35 * diskSmoothness);
            vec3 base = diskPalette(rNorm) * tex * beaming;
            
            float NdotV = abs(dot(rotX(diskIncline)*vec3(0.0,1.0,0.0), -normalize(V)));
            base *= mix(0.65, 1.0, pow(NdotV, 0.5));
            
            // Outer glow effect
            float outerGlow = smoothstep(0.7, 1.0, rNorm) * glowIntensity * (0.8 + 0.2 * sin(iTime * 0.5));
            base += outerGlow * vec3(1.0, 0.8, 0.6) * exp(-(1.0 - rNorm) / glowRadius);
            
            return base;
          }

          void main(){
            vec2 uv = gl_FragCoord.xy / iResolution.xy; vec2 p = uv * 2.0 - 1.0; p.x *= iResolution.x / iResolution.y;
            float fy = tan(0.5 * fovY);
            vec3 rd = normalize(vec3(p.x * fy, -p.y * fy, -1.0));
            rd = rotX(camTilt) * rd;
            Hit hit = traceRay(camPos, rd);
            vec3 col = vec3(0.0);
            if (hit.hit) col += shadeDisk(hit.pos, hit.dir);
            float r = length(hit.pos);
            if (r < rs) col = vec3(0.0);
            float photonRing = 1.5 * rs;
            float glow = exp(-10.0 * abs(r - photonRing));
            col += vec3(1.1, 0.9, 0.7) * glow * 0.5;
            gl_FragColor = vec4(tonemap(col), 1.0);
          }
        `,
        depthWrite: false
      })
    );
    scene.add(quad);

    const state = { distance: uniforms.camPos.value.z, azimuth: 0.0, elevation: 0.25, tilt: uniforms.camTilt.value };
    let isDragging = false, lastX=0, lastY=0;
    container.addEventListener('pointerdown', e=>{ isDragging=true; lastX=e.clientX; lastY=e.clientY; });
    window.addEventListener('pointerup', ()=>{ isDragging=false; });
    window.addEventListener('pointermove', e=>{ if(!isDragging) return; const dx=(e.clientX-lastX)/container.clientWidth; const dy=(e.clientY-lastY)/container.clientHeight; lastX=e.clientX; lastY=e.clientY; state.azimuth -= dx*Math.PI; state.elevation = THREE.MathUtils.clamp(state.elevation+dy*Math.PI*0.5, -0.8, 0.8); updateCamera(); });
    container.addEventListener('wheel', e=>{ e.preventDefault(); state.distance = THREE.MathUtils.clamp(state.distance*(1.0+Math.sign(e.deltaY)*0.08), 2.0, 20.0); updateCamera(); }, { passive: false });

    function updateCamera(){ const r=state.distance; const cx=r*Math.sin(state.azimuth)*Math.cos(state.elevation); const cy=r*Math.sin(state.elevation); const cz=r*Math.cos(state.azimuth)*Math.cos(state.elevation); uniforms.camPos.value.set(cx, cy, cz); uniforms.camTilt.value = state.tilt; }
    updateCamera();

    const gui = new GUI();
    gui.add(uniforms.rs, 'value', 0.2, 1.8, 0.01).name('Schwarzschild r_s');
    gui.add(uniforms.diskRin, 'value', 0.9, 6.0, 0.01).name('Disk inner R');
    gui.add(uniforms.diskRout, 'value', 5.0, 20.0, 0.1).name('Disk outer R');
    gui.add(uniforms.diskIncline, 'value', 0.0, 1.2, 0.001).name('Disk incline');
    gui.add(uniforms.exposure, 'value', 0.2, 2.5, 0.01).name('Exposure');
    gui.add(uniforms.h, 'value', 0.01, 0.12, 0.001).name('Step size h');
    gui.add(uniforms.steps, 'value', 60, 400, 1).name('Steps').onChange(v=>{ uniforms.steps.value = Math.floor(v); });
    gui.add(uniforms.glowIntensity, 'value', 0.0, 2.0, 0.01).name('Glow Intensity');
    gui.add(uniforms.glowRadius, 'value', 0.1, 1.0, 0.01).name('Glow Radius');
    gui.add(uniforms.diskSmoothness, 'value', 0.1, 1.0, 0.01).name('Disk Smoothness');
    gui.add(state, 'tilt', -0.6, 0.6, 0.001).name('Camera tilt').onChange(v=>{ state.tilt = v; updateCamera(); });
    gui.close();

    window.addEventListener('keydown', e=>{ if (e.key.toLowerCase()==='g') gui._hidden ? gui.show() : gui.hide(); });
    function onResize(){ renderer.setSize(container.clientWidth, container.clientHeight); uniforms.iResolution.value.set(renderer.domElement.width, renderer.domElement.height); }
    window.addEventListener('resize', onResize);

    const clock = new THREE.Clock();
    function tick(){ uniforms.iTime.value = clock.getElapsedTime(); renderer.render(scene, camera); requestAnimationFrame(tick); }
    tick();
  </script>
</body>
</html>
