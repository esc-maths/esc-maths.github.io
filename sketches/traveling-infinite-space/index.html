<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.jsdelivr.net/npm/p5@1.11.10/lib/p5.min.js"></script>

  <link rel="stylesheet" type="text/css" href="style.css">

<body>
  <main>
    <div id="controls-menu">
      <div id="controls-content">

        <h4>😃 Controls <span style="text-decoration: none;">🕹️</span></h4>
        <p>Navigate with the arrow keys, or click once and move the mouse to look around.</p>
        <ul>
          <li><b>Enter</b> → New random seed</li>
          <li><b>T</b> → Info</li>
          <li><b>[</b> → Decrease Objects</li>
          <li><b>]</b> → Increase Objects</li>
          <li><b>N</b> → Toggle noise</li>
          <li><b>L</b> → Toggle layers</li>
          <!-- <li><b>/</b> → Flip vertically</li>-->
          <li><b>C</b> → Show/Hide this menu</li>
        </ul>
      </div>
    </div>

  </main>
  <script src="sketch.js"></script>


  <script>

  </script>
</body>

</html>
