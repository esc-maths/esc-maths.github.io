<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js Torus Donuts</title>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.180.0/build/three.module.min.js",
                "three/addons/": "https://unpkg.com/three@0.180.0/examples/jsm/"
            }
        }
    </script>
    <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #000000;
    }

    canvas {
      display: block;
    }
  </style>
</head>

<body>
  <script type="module">
    import * as THREE from 'three';

    // Scene setup
    let w = window.innerWidth;
    let h = window.innerHeight;
    const fov = 500;

    let scene, camera, renderer;
    let torusMeshes = [];

    // Animation parameters
    let torusSpeed = 8;
    const torusSpeedMin = torusSpeed;
    let torusRotation = 0;
    let torusRotationSpeed = 0.15;
    const torusRotationSpeedMin = torusRotationSpeed;

    const torusCount = 500;
    const torusDiameter = 104;
    const torusMaxZ = -fov + torusDiameter;
    const torusDistance = 8000;

    const torusGlazeColors = [
      new THREE.Color(0.96, 0.38, 0.45),
      new THREE.Color(1.00, 0.74, 0.20),
      new THREE.Color(0.55, 0.15, 0.75),
      new THREE.Color(0.10, 0.90, 0.85),
      new THREE.Color(0.94, 0.20, 0.32),
      new THREE.Color(0.15, 0.70, 0.25),
      new THREE.Color(1.00, 1.00, 1.00)
    ];

    const torusDoughColors = [
      new THREE.Color(251 / 255, 171 / 255, 24 / 255)
    ];

    function init() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0, 0, 0);
      scene.fog = new THREE.Fog(new THREE.Color(0, 0, 0), 500, 7000);

      camera = new THREE.PerspectiveCamera(75, w / h, 0.1, 10000);
      camera.position.z = 5000;

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(w, h);
      renderer.setPixelRatio(window.devicePixelRatio);
      document.body.appendChild(renderer.domElement);

      const gradientTexture = createGradientTexture();
      addTori(gradientTexture);
      addLight();

      window.addEventListener('resize', onResize, false);

      render();
    }

    function createGradientTexture() {
      const size = 64;
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const context = canvas.getContext('2d');
      const gradient = context.createLinearGradient(0, 0, size, 0);
      gradient.addColorStop(0.0, '#000');
      gradient.addColorStop(0.5, '#555');
      gradient.addColorStop(0.6, '#999');
      gradient.addColorStop(1.0, '#FFF');
      context.fillStyle = gradient;
      context.fillRect(0, 0, size, size);
      const texture = new THREE.CanvasTexture(canvas);
      texture.needsUpdate = true;
      return texture;
    }

    function onResize() {
      w = window.innerWidth;
      h = window.innerHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    }

    function addTori(gradientTexture) {
      for (let i = 0; i < torusCount; i++) {
        const radiusX = Math.random() * 2200 + 200;
        const radiusY = Math.random() * 2200 + 200;
        const numOfItems = Math.ceil(Math.random() * torusCount);

        const x = radiusX * Math.cos(i * ((Math.PI * 2) / numOfItems));
        const y = radiusY * Math.sin(i * ((Math.PI * 2) / numOfItems));
        const z = Math.round(Math.random() * torusDistance);

        const torusData = {
          x, y, z,
          ox: x,
          oy: y,
          radius: torusDiameter * 0.5,
          tube: torusDiameter * 0.25,
          radialSegments: 12,
          tubularSegments: 24,
          arc: Math.PI * 2,
          rotationXSpeed: Math.random() + 0.25,
          rotationYSpeed: Math.random() + 0.25,
          rotationXDir: Math.random() < 0.5 ? -1 : 1,
          rotationYDir: Math.random() < 0.5 ? -1 : 1,
          rotationX: Math.random() * 1000,
          rotationY: Math.random() * 1000,
          distance: torusDistance - z,
          distanceTotal: Math.round(torusDistance - torusMaxZ),
          colorDough: torusDoughColors[Math.floor(Math.random() * torusDoughColors.length)],
          colorGlaze: torusGlazeColors[Math.floor(Math.random() * torusGlazeColors.length)]
        };

        const geometry = new THREE.TorusGeometry(
          torusData.radius,
          torusData.tube,
          torusData.radialSegments,
          torusData.tubularSegments,
          torusData.arc
        );

        const material = new THREE.MeshToonMaterial({
          color: torusData.colorDough,
          gradientMap: gradientTexture
        });

        const torusMesh = new THREE.Mesh(geometry, material);
        torusMesh.position.set(torusData.x, torusData.y, torusData.z);
        torusMesh.userData = torusData;
        scene.add(torusMesh);
        torusMeshes.push(torusMesh);
      }
    }

    function addLight() {
      const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
      directionalLight.position.set(0, 0, -fov * 0.5);
      scene.add(directionalLight);
      const ambientLight = new THREE.AmbientLight(0x404040, 0.5);
      scene.add(ambientLight);
    }

    function updateTori() {
      torusSpeed = Math.max(torusSpeed - 0.5, torusSpeedMin);
      torusRotationSpeed = Math.max(torusRotationSpeed - 0.0025, torusRotationSpeedMin);

      torusRotation += torusRotationSpeed;

      torusMeshes.sort((a, b) => b.position.z - a.position.z);

      for (let torusMesh of torusMeshes) {
        const torusData = torusMesh.userData;

        torusData.z -= torusSpeed;
        torusData.distance += torusSpeed;

        if (torusData.z < torusMaxZ) {
          torusData.z = torusDistance;
          torusData.distance = 0;
        }

        torusMesh.position.z = torusData.z;

        const radians = Math.PI / 180 * torusRotation;
        const cos = Math.cos(radians);
        const sin = Math.sin(radians);

        torusData.x = cos * torusData.ox + sin * torusData.oy;
        torusData.y = cos * torusData.oy - sin * torusData.ox;
        torusMesh.position.x = torusData.x;
        torusMesh.position.y = torusData.y;

        torusData.rotationX += torusData.rotationXSpeed * torusData.rotationXDir;
        torusData.rotationY += torusData.rotationYSpeed * torusData.rotationYDir;

        torusMesh.rotation.x = torusData.rotationX * Math.PI / 180;
        torusMesh.rotation.y = torusData.rotationY * Math.PI / 180;

        const distancePercent = Math.max(0, Math.min(1, torusData.distance / torusData.distanceTotal));
        if (distancePercent > 0) {
          torusMesh.material.emissive = torusData.colorGlaze.clone();
          torusMesh.material.emissiveIntensity = 0.3 * distancePercent;
        }
      }
    }

    function render() {
      updateTori();
      renderer.render(scene, camera);
      requestAnimationFrame(render);
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>

</html>
