<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Matrix Column Normalizer</title>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      font-size: 1.1rem;
      background: #f4f4f9;
      color: #222;
      margin: 20px;
      line-height: 1.6;
      padding: 0px 50px 100px 50px;
    }
    h1 { text-align: center; margin-bottom: 10px; }
    textarea {
      width: 100%;
      height: 150px;
      font-family: monospace;
      font-size: 1rem;
      margin-bottom: 10px;
      margin-top: -15px;
      padding: 8px;
    }
    button {
      background: #0077cc;
      color: white;
      border: none;
      padding: 10px 16px;
      font-size: 1rem;
      border-radius: 5px;
      cursor: pointer;
      margin-top: 10px;
    }
    button:hover { background: #005fa3; }
    .output-section {
      margin-top: 20px;
      padding: 15px;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    pre {
      background: #272822;
      color: #f8f8f2;
      padding: 10px;
      border-radius: 5px;
      overflow-x: auto;
    }
  </style>
</head>
<body>
  <h1>Matrix Column Normalizer</h1>
  <p>Enter an \(n \times n\) matrix (rows separated by newlines, numbers by spaces).  
     Max \(n = 20\).<br/>
      <b>Example:</b><br>
     <code>1 2<br>3 4</code></p>
    <p><b>Input:</b></p>
  <textarea id="matrixInput">1 2
3 4</textarea>
  <br>
  <button onclick="processMatrix()">Normalize Columns</button>

  <div class="output-section">
    <h2>Normalized Matrix (LaTeX)</h2>
    <div id="latexOutput">–</div>
  </div>

  <div class="output-section">
    <h2>Normalized Matrix (Plain Text)</h2>
    <pre id="plainOutput">–</pre>
  </div>

  <div class="output-section">
    <h2>Python Code</h2>
    <pre id="pythonCode"></pre>
  </div>

  <div class="output-section">
    <h2>JavaScript Code</h2>
    <pre id="jsCode"></pre>
  </div>

  <div class="output-section">
    <h2>MATLAB Code</h2>
    <pre id="matlabCode"></pre>
  </div>

  <script>
    function parseMatrix(input) {
      return input.trim().split("\n").map(row =>
        row.trim().split(/\s+/).map(Number)
      );
    }

    function normalizeColumns(A) {
      const n = A.length;
      const m = A[0].length;
      const result = Array.from({length: n}, () => Array(m).fill(0));

      for (let j = 0; j < m; j++) {
        let norm = 0;
        for (let i = 0; i < n; i++) norm += A[i][j] ** 2;
        norm = Math.sqrt(norm);
        for (let i = 0; i < n; i++) result[i][j] = A[i][j] / norm;
      }
      return result;
    }

    function toLatex(A) {
      let rows = A.map(row => row.map(x => x.toFixed(4)).join(" & "));
      return `\\begin{bmatrix} ${rows.join(" \\\\ ")} \\end{bmatrix}`;
    }

    function toPlainText(A) {
      return A.map(row => row.map(x => x.toFixed(4)).join(" ")).join("\n");
    }

    function processMatrix() {
      let input = document.getElementById("matrixInput").value;
      let A = parseMatrix(input);
      let B = normalizeColumns(A);

      // Show LaTeX
      let latex = toLatex(B);
      document.getElementById("latexOutput").innerHTML = `$$${latex}$$`;
      MathJax.typeset();

      // Show plain text
      document.getElementById("plainOutput").textContent = toPlainText(B);

      // Code snippets
      document.getElementById("pythonCode").textContent =
`import numpy as np

def normalize_columns(A):
    A = np.array(A, dtype=float)
    norms = np.linalg.norm(A, axis=0)
    return A / norms

A = ${JSON.stringify(A)}
print(normalize_columns(A))`;

      document.getElementById("jsCode").textContent =
`function normalizeColumns(A) {
  const n = A.length;
  const m = A[0].length;

  }

let A = ${JSON.stringify(A)};
console.log(normalizeColumns(A));`;

      document.getElementById("matlabCode").textContent =
`function B = normalize_columns(A)
    norms = sqrt(sum(A.^2, 1));
    B = A ./ norms;
end

A = ${JSON.stringify(A).replace(/\[/g,'[').replace(/\]/g,']')};
B = normalize_columns(A)`;
    }
  </script>
</body>
</html>
