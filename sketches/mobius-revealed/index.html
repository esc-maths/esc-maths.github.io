<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Möbius Rigid Motions - Real & Imaginary Axes</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; }
        canvas { display: block; }
        .ui {
            position: absolute; top: 20px; left: 20px;
            background: rgba(10, 10, 15, 0.9); padding: 20px;
            border-radius: 12px; border: 1px solid #0ff; color: #fff;
            width: 280px; backdrop-filter: blur(8px); z-index: 10;
            transition: transform 0.3s ease, opacity 0.3s ease;
        }
        .ui.hidden {
            transform: translateX(-320px);
            opacity: 0;
            pointer-events: none;
        }
        .control { margin-bottom: 15px; }
        label { display: flex; justify-content: space-between; font-size: 11px; color: #8af; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 1px; }
        input[type=range] { width: 100%; cursor: pointer; accent-color: #0ff; }
        span { font-family: monospace; color: #0ff; background: rgba(0,255,255,0.1); padding: 2px 4px; border-radius: 3px; }
        h2 { margin: 0 0 15px 0; font-size: 14px; color: #0ff; text-align: center; border-bottom: 1px solid #333; padding-bottom: 10px; }
        
        /* Toggle button styles */
        .toggle-ui-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 20;
            background: rgba(10, 10, 15, 0.9);
            backdrop-filter: blur(8px);
            border: 1px solid #0ff;
            color: #0ff;
            width: 36px;
            height: 36px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            font-family: monospace;
        }
        .toggle-ui-btn:hover {
            background: rgba(0, 255, 255, 0.2);
            transform: scale(1.05);
        }
        .toggle-ui-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>
<button id="toggleUI" class="toggle-ui-btn">✕</button>

<div class="ui" id="uiPanel">
    <h2>RIGID MÖBIUS</h2>
    <div class="control">
        <label>Scaling (Height Z) <span id="sz_val">1.00</span></label>
        <input type="range" id="sz" min="1.0" max="4.0" step="0.01" value="1.0">
    </div>
    <div class="control">
        <label>Translate X <span id="tx_val">0.00</span></label>
        <input type="range" id="tx" min="-3.0" max="3.0" step="0.01" value="0.0">
    </div>
    <div class="control">
        <label>Translate Y <span id="ty_val">0.00</span></label>
        <input type="range" id="ty" min="-3.0" max="3.0" step="0.01" value="0.0">
    </div>
    <div class="control">
        <label>Rotation (Around Z) <span id="rot_val">0.00</span></label>
        <input type="range" id="rot" min="0" max="6.28" step="0.01" value="0.0">
    </div>
    <div class="control">
        <label>Inversion (Around Y) <span id="inv_val">0.00</span></label>
        <input type="range" id="inv" min="0" max="3.14" step="0.01" value="0.0">
    </div>
</div>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>

<script type="module">
import * as THREE from 'three';

// UI Toggle functionality
const uiPanel = document.getElementById('uiPanel');
const toggleBtn = document.getElementById('toggleUI');
let uiVisible = true;

toggleBtn.addEventListener('click', () => {
    uiVisible = !uiVisible;
    if (uiVisible) {
        uiPanel.classList.remove('hidden');
        toggleBtn.textContent = '✕';
    } else {
        uiPanel.classList.add('hidden');
        toggleBtn.textContent = '☰';
    }
});

const params = { tx: 0, ty: 0, sz: 1.0, rot: 0, inv: 0 };
const setupSlider = (id) => {
    const el = document.getElementById(id);
    el.addEventListener('input', (e) => {
        params[id] = parseFloat(e.target.value);
        document.getElementById(id + '_val').innerText = params[id].toFixed(2);
    });
};
['tx','ty','sz','rot','inv'].forEach(setupSlider);

const scene = new THREE.Scene();
const camera = new THREE.OrthographicCamera(-1,1,1,-1,0,1);
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

const uniforms = {
    iTime: { value: 0 },
    iResolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
    uSphPos: { value: new THREE.Vector3(0,0,0.5) },
    uSphRot: { value: new THREE.Vector2(0,0) }
};

const fragmentShader = `
uniform float iTime;
uniform vec2 iResolution;
uniform vec3 uSphPos;
uniform vec2 uSphRot;

#define ROT(a) mat2(cos(a), sin(a), -sin(a), cos(a))

vec2 raySphere(vec3 ro, vec3 rd, vec4 sph){
    vec3 oc = ro - sph.xyz;
    float b = dot(oc,rd);
    float c = dot(oc,oc)-sph.w*sph.w;
    float h = b*b - c;
    return h<0.0 ? vec2(-1.0) : vec2(-b-sqrt(h), -b+sqrt(h));
}

float rayPlane(vec3 ro, vec3 rd){
    return -ro.z/rd.z;
}

void applyInverseRigid(inout vec3 p, vec3 center, vec2 r){
    p -= center;
    p.xz *= ROT(-r.y);
    p.xy *= ROT(-r.x);
    p += center;
}

vec3 planeToSphere(vec3 p, vec4 sph){
    vec3 N = sph.xyz + vec3(0,0,sph.w);
    vec3 rd = normalize(N - p);
    float t = raySphere(p, rd, sph).x;
    return p + rd*t;
}

vec3 sphereToPlane(vec3 p, vec4 sph){
    vec3 N = sph.xyz + vec3(0,0,sph.w);
    vec3 rd = normalize(p - N);
    float t = rayPlane(p, rd);
    return p + rd*t;
}

vec3 drawDot(vec2 p, vec2 target, vec3 col) {
    float d = length(p - target);
    float m = smoothstep(0.04, 0.0, d);
    float glow = exp(-20.0 * d);
    return col * (m + glow * 10.0);
}

// Function to draw a line along an axis
float drawAxisLine(float coord, float width) {
    return smoothstep(width, 0.0, abs(coord));
}

vec3 getGridColor(vec2 uv){
    // Scale density
    vec2 gridUV = uv * 2.0; 
    vec2 g = abs(fract(gridUV + 0.5) - 0.5);

    // Standard grid lines
    float lineX = smoothstep(0.04,0.0,g.x);
    float lineY = smoothstep(0.04,0.0,g.y);

    vec3 colorGridX = vec3(0.0, 0.5, 0.5); // Subdued Cyan
    vec3 colorGridY = vec3(0.5, 0.0, 0.4); // Subdued Magenta

    vec3 col = vec3(0.02, 0.02, 0.04);
    col = mix(col, colorGridX, lineX);
    col = mix(col, colorGridY, lineY);
    
    // Grid glow
    col += colorGridX * exp(-20.0*g.x)*0.1;
    col += colorGridY * exp(-20.0*g.y)*0.1;

    // --- MAIN AXES ---
    // Draw thick, bright axes at local origin (0,0)
    float axisWidth = 0.05;
    // X=0 is Imaginary Axis, Y=0 is Real Axis
    float imaginaryAxisMask = drawAxisLine(uv.x, axisWidth);
    float realAxisMask = drawAxisLine(uv.y, axisWidth);

    vec3 colorReal = vec3(1.0, 0.5, 0.0); // Neon Orange
    vec3 colorImag = vec3(0.0, 0.6, 1.0); // Neon Electric Blue

    // Apply main axes and their glows
    col = mix(col, colorImag, imaginaryAxisMask);
    col = mix(col, colorReal, realAxisMask);
    
    col += colorImag * exp(-25.0 * abs(uv.x)) * 0.8;
    col += colorReal * exp(-25.0 * abs(uv.y)) * 0.8;

    return col;
}

void main(){
    vec2 uv = (gl_FragCoord.xy - 0.5*iResolution.xy)/iResolution.y;

    // Fixed observer view
    vec3 ro = vec3(2.5, -5.0, 4.5); 
    vec3 lookat = vec3(0.5, 0.5, 0.5);
    vec3 fwd = normalize(lookat - ro);
    vec3 right = normalize(cross(fwd, vec3(0,0,1)));
    vec3 up = cross(right, fwd);

    float zoom = 3.0;
    vec3 rd = normalize(fwd*zoom + uv.x*right + uv.y*up);

    // Initial offset provided in your prompt
    vec3 translateObjects = vec3(2.2, 4.0, 0.0);
    vec4 sph = vec4(uSphPos + translateObjects, 0.5);
    
    float tPlane = rayPlane(ro, rd);
    vec2 tSph = raySphere(ro, rd, sph);

    float t = 1e10;
    bool hitSph = false;
    if(tSph.x>0.0){ t=tSph.x; hitSph=true; }
    if(tPlane>0.0 && tPlane<t){ t=tPlane; hitSph=false; }

    vec3 col = vec3(0.01);

    if(t<50.0){
        vec3 pos = ro + rd*t;
        
        // 1. Map world point to the sphere
        vec3 pOnSph = hitSph ? pos : planeToSphere(pos, sph);
        
        // 2. Apply Rotations and Inversion
        applyInverseRigid(pOnSph, sph.xyz, uSphRot);
        
        // 3. Project back to plane
        vec3 gridP = sphereToPlane(pOnSph, sph);

        // --- THE SCALING LOGIC ---
        // uSphPos.z acts as the Dilation factor. 
        vec2 localUV = (gridP.xy - uSphPos.xy - translateObjects.xy) / (uSphPos.z * 2.0);
        
        col = getGridColor(localUV);

        // --- REFERENCE POINTS (z = 1+i, -1-i, 1-i, -1+i) ---
        col += drawDot(localUV, vec2(1.0, 1.0), vec3(1.0, 1.0, 0.0)); // Yellow
        col += drawDot(localUV, vec2(-1.0, -1.0), vec3(0.0, 1.0, 0.0)); // Green
        col += drawDot(localUV, vec2(1.0, -1.0), vec3(1.0, 0.0, 0.0)); // Red
        col += drawDot(localUV, vec2(-1.0, 1.0), vec3(0.0, 0.5, 1.0)); // Blue

        if(hitSph){
            vec3 n = normalize(pos - sph.xyz);
            float diff = max(0.4, dot(n, normalize(vec3(3,3,4)-pos)));
            col *= diff;
            col += pow(1.0 - max(0.0, dot(n, -rd)), 3.0) * 0.4; // Fresnel highlight
        } else {
            col *= exp(-0.06*t); // Distance fog
        }
    }

    gl_FragColor = vec4(pow(col, vec3(0.4545)),1.0);
}
`;

const material = new THREE.ShaderMaterial({
    uniforms, fragmentShader,
    vertexShader:`void main(){gl_Position=vec4(position,1.0);}`
});
scene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), material));

function animate(t){
    uniforms.iTime.value = t*0.001;
    uniforms.uSphPos.value.set(params.tx, params.ty, params.sz);
    uniforms.uSphRot.value.set(params.rot, params.inv);
    renderer.render(scene,camera);
    requestAnimationFrame(animate);
}
requestAnimationFrame(animate);

window.addEventListener('resize',()=>{
    renderer.setSize(window.innerWidth,window.innerHeight);
    uniforms.iResolution.value.set(window.innerWidth*window.devicePixelRatio,window.innerHeight*window.devicePixelRatio);
});
</script>
</body>
</html>
