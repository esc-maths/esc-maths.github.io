<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js TSL - Tangent Function Pattern</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: black; }
        #info {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: rgba(255,255,255,0.7);
            font-family: 'Courier New', monospace;
            font-size: 14px;
            background: rgba(0,0,0,0.7);
            padding: 4px 12px;
            border-radius: 20px;
            z-index: 100;
        }
    </style>
    
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@v0.179.0/build/three.webgpu.js",
                "three/webgpu": "https://cdn.jsdelivr.net/npm/three@v0.179.0/build/three.webgpu.js",
                "three/tsl": "https://cdn.jsdelivr.net/npm/three@v0.179.0/build/three.tsl.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@v0.179.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="info">Three.js TSL | tangent function | 20k points</div>

    <script type="module">
        import * as THREE from "three";
        import { OrbitControls } from "three/addons/controls/OrbitControls.js";
        import { 
            color, 
            positionLocal, 
            time, 
            vec3, 
            vec2,
            mod, 
            float, 
            Fn,
            sin,
            cos,
            tan,
            length,
            floor,
            instanceIndex,
            mul,
            div,
            add,
            sub,
            PI
        } from "three/tsl";

        // Setup
        const w = window.innerWidth;
        const h = window.innerHeight;
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x060606); // background(6) in p5.js

        // Orthographic camera for 2D-like rendering
        const camera = new THREE.OrthographicCamera(-250, 250, 250, -250, 0.1, 1000);
        camera.position.z = 500;
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGPURenderer({ antialias: true });
        renderer.setAnimationLoop(animate);
        renderer.setSize(w, h);
        renderer.setPixelRatio(2);
        document.body.appendChild(renderer.domElement);

        // Controls - disabled for this effect
        const ctrls = new OrbitControls(camera, renderer.domElement);
        ctrls.enableDamping = true;
        ctrls.enableZoom = false;
        ctrls.enablePan = false;
        ctrls.enableRotate = false;

        // Create geometry for points
        const pointSize = 1.2;
        const geometry = new THREE.PlaneGeometry(pointSize, pointSize);
        
        // Number of points
        const startCount = 20000;

        // Create material with custom position node
        const material = new THREE.MeshBasicNodeMaterial({
            transparent: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            side: THREE.DoubleSide
        });

        // Custom position node
        material.positionNode = Fn(() => {
            // Get instance index as float
            const i = float(instanceIndex);
            
            // Grid sampling: x = i % 100, y = i / 100
            const x = mod(i, 100.0);
            const y = div(i, 100.0);
            
            // Time: t += PI/90
            const t = mul(time, 0.7);
            
            // Intermediate variables
            // k = x/4 - 12.5
            const k = sub(div(x, 4.0), 12.5);
            
            // e = y/9 + 5
            const e = add(div(y, 9.0), 5.0);
            
            // o = mag(k, e) / 9
            const o = div(length(vec2(k, e)), 9.0);
            
            // Add epsilon to avoid division by zero in tan(1/k)
            const eps = 0.0001;
            
            // q = x + 99 + tan(1/k) + o*k*(cos(e*9)/4 + cos(y/2))*sin(o*4 - t)
            const term1 = add(x, 99.0);
            const term2 = tan(div(1.0, add(k, eps)));
            
            const innerCos = add(div(cos(mul(e, 9.0)), 4.0), cos(div(y, 2.0)));
            const term3 = mul(mul(mul(o, k), innerCos), sin(sub(mul(o, 4.0), t)));
            
            const q = add(add(term1, term2), term3);
            
            // c = o * e / 30 - t/8
            const c = sub(div(mul(o, e), 30.0), div(t, 8.0));
            
            // Final coordinates
            // px = q*0.7*sin(c) + 9*cos(y/19 + t) + 250
            const px = add(
                add(
                    mul(mul(q, 0.7), sin(c)),
                    mul(9.0, cos(add(div(y, 19.0), t)))
                ),
                250.0
            );
            
            // py = 250 + (q/2)*cos(c)
            const py = add(250.0, mul(div(q, 2.0), cos(c)));
            
            // Convert to world space (-250 to 250)
            const worldX = sub(px, 250.0);
            const worldY = sub(250.0, py);
            const worldZ = 0.0;
            
            return positionLocal.add(vec3(worldX, worldY, worldZ));
        })();

        // Set color and opacity - stroke(255, 46) -> white with alpha ~0.18
        material.colorNode = color(0xffffff);
        material.opacityNode = float(0.18);

        // Create instanced mesh
        const points = new THREE.InstancedMesh(geometry, material, startCount);
        scene.add(points);

        // Animation loop
        function animate() {
            renderer.render(scene, camera);
            ctrls.update();
        }

        // Handle window resize
        function handleWindowResize() {
            camera.left = -250;
            camera.right = 250;
            camera.top = 250;
            camera.bottom = -250;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        window.addEventListener('resize', handleWindowResize, false);
        
        console.log('Tangent function pattern running');
    </script>
</body>
</html>
