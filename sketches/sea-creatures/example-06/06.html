<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js TSL - Yuruyurau Style - Example 6</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: black; }
        #info {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: rgba(255,255,255,0.7);
            font-family: 'Courier New', monospace;
            font-size: 14px;
            background: rgba(0,0,0,0.7);
            padding: 4px 12px;
            border-radius: 20px;
            z-index: 100;
        }
    </style>
    
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@v0.179.0/build/three.webgpu.js",
                "three/webgpu": "https://cdn.jsdelivr.net/npm/three@v0.179.0/build/three.webgpu.js",
                "three/tsl": "https://cdn.jsdelivr.net/npm/three@v0.179.0/build/three.tsl.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@v0.179.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="info">Three.js TSL | | yuruyurau style | 25k points</div>

    <script type="module">
        import * as THREE from "three";
        import { OrbitControls } from "three/addons/controls/OrbitControls.js";
        import { 
            color, 
            positionLocal, 
            time, 
            vec3, 
            vec2,
            mod, 
            float, 
            Fn,
            sin,
            cos,
            length,
            step,
            instanceIndex,
            mul,
            div,
            add,
            sub,
            PI
        } from "three/tsl";

        // Setup
        const w = window.innerWidth;
        const h = window.innerHeight;
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000000);

        // Orthographic camera for 2D-like rendering
        const camera = new THREE.OrthographicCamera(-250, 250, 250, -250, 0.1, 1000);
        camera.position.z = 500;
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGPURenderer({ antialias: true });
        renderer.setAnimationLoop(animate);
        renderer.setSize(w, h);
        renderer.setPixelRatio(2);
        document.body.appendChild(renderer.domElement);

        // Controls - disabled for this effect
        const ctrls = new OrbitControls(camera, renderer.domElement);
        ctrls.enableDamping = true;
        ctrls.enableZoom = false;
        ctrls.enablePan = false;
        ctrls.enableRotate = false;

        // Create geometry for points
        const pointSize = 1.2;
        const geometry = new THREE.PlaneGeometry(pointSize, pointSize);
        
        // Number of points
        const startCount = 25000;

        // Create material with custom position node
        const material = new THREE.MeshBasicNodeMaterial({
            transparent: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            side: THREE.DoubleSide
        });

        // Custom position node using Fn - adapted from p5.js sketch
        material.positionNode = Fn(() => {
            // Get instance index as float (reverse to match i > 0 loop)
            const i = float(sub(25000.0, float(instanceIndex)));
            
            // y parameter from drawPoint(y, i) where y = i/500
            const y = div(i, 500.0);
            
            // Time: t += PI/65 (faster than previous)
            const t = mul(time, 2.2); // Scale to match visual speed
            
            // Oscillation term with conditional based on y threshold
            // k = cos(y*9) * (y < 5 ? sin(t/8 + y) * 35 : 11)
            const threshold = 5.0;
            
            // Calculate both possibilities
            const k_low = mul(sin(add(div(t, 8.0), y)), 35.0);
            const k_high = float(11.0);
            
            // Use step for conditional
            const isHigh = step(threshold, y); // 1 if y >= threshold
            const isLow = sub(1.0, isHigh); // 1 if y < threshold
            
            const k_amp = add(mul(isLow, k_low), mul(isHigh, k_high));
            const k = mul(cos(mul(y, 9.0)), k_amp);
            
            // Vertical shift term: e = y/8 - 13
            const e = sub(div(y, 8.0), 13.0);
            
            // Polar magnitude scaling: o = mag(k, e) / 6
            const o = div(length(vec2(k, e)), 6.0);
            
            // Angular coordinate (4-phase symmetry)
            // c = o/3 - e/5 - t/8 + (i%4)*8
            const i_mod_4 = mod(i, 4.0);
            const c = add(sub(sub(div(o, 3.0), div(e, 5.0)), div(t, 8.0)), mul(i_mod_4, 8.0));
            
            // Radial expression
            // q = k*y/19 + 49 + k*sin(y)*sin(o*2 - e/5 - t)
            const term1 = div(mul(k, y), 19.0);
            const term2 = float(49.0);
            const term3 = mul(mul(k, sin(y)), sin(sub(sub(mul(o, 2.0), div(e, 5.0)), t)));
            
            const q = add(add(term1, term2), term3);
            
            // Final coordinates with scale s = 1.3
            const s = 1.3;
            
            // x = s * ( q * sin(c) - 79 * cos(c/3) ) + width/2
            const x = add(mul(s, sub(mul(q, sin(c)), mul(79.0, cos(div(c, 3.0))))), 250.0);
            
            // yPos = s * ( (q + 70) * cos(c) ) + height/2
            const yPos = add(mul(s, mul(add(q, 70.0), cos(c))), 250.0);
            
            // Convert to world space (-250 to 250) for orthographic camera
            const worldX = sub(x, 250.0);
            const worldY = sub(250.0, yPos);
            const worldZ = 0.0;
            
            return positionLocal.add(vec3(worldX, worldY, worldZ));
        })();

        // Set color and opacity
        material.colorNode = color(0xffffff);
        material.opacityNode = float(0.12);

        // Create instanced mesh
        const points = new THREE.InstancedMesh(geometry, material, startCount);
        scene.add(points);

        // Animation loop
        function animate() {
            renderer.render(scene, camera);
            ctrls.update();
        }

        // Handle window resize
        function handleWindowResize() {
            const size = Math.min(window.innerWidth, window.innerHeight, 500);
            camera.left = -250;
            camera.right = 250;
            camera.top = 250;
            camera.bottom = -250;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        window.addEventListener('resize', handleWindowResize, false);
        
        console.log('Adapted p5.js sketch running in Three.js TSL');
    </script>
</body>
</html>
