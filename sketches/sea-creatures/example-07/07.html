<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js TSL - Yuruyurau Style (Adapted)</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: black; }
        #info {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: rgba(255,255,255,0.7);
            font-family: 'Courier New', monospace;
            font-size: 14px;
            background: rgba(0,0,0,0.7);
            padding: 4px 12px;
            border-radius: 20px;
            z-index: 100;
        }
    </style>
    
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@v0.179.0/build/three.webgpu.js",
                "three/webgpu": "https://cdn.jsdelivr.net/npm/three@v0.179.0/build/three.webgpu.js",
                "three/tsl": "https://cdn.jsdelivr.net/npm/three@v0.179.0/build/three.tsl.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@v0.179.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="info">Three.js TSL | adapted p5.js sketch | 30k points</div>

    <script type="module">
        import * as THREE from "three";
        import { OrbitControls } from "three/addons/controls/OrbitControls.js";
        import { 
            color, 
            positionLocal, 
            time, 
            vec3, 
            vec2,
            mod, 
            float, 
            Fn,
            sin,
            cos,
            length,
            atan2,
            pow,
            floor,
            instanceIndex,
            mul,
            div,
            add,
            sub,
            PI
        } from "three/tsl";

        // Setup
        const w = window.innerWidth;
        const h = window.innerHeight;
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000000);

        // Orthographic camera for 2D-like rendering
        const camera = new THREE.OrthographicCamera(-250, 250, 250, -250, 0.1, 1000);
        camera.position.z = 500;
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGPURenderer({ antialias: true });
        renderer.setAnimationLoop(animate);
        renderer.setSize(w, h);
        renderer.setPixelRatio(2);
        document.body.appendChild(renderer.domElement);

        // Controls - disabled for this effect
        const ctrls = new OrbitControls(camera, renderer.domElement);
        ctrls.enableDamping = true;
        ctrls.enableZoom = false;
        ctrls.enablePan = false;
        ctrls.enableRotate = false;

        // Create geometry for points
        const pointSize = 1;
        const geometry = new THREE.PlaneGeometry(pointSize, pointSize);
        
        // Number of points (30,000 as in the p5.js sketch)
        const startCount = 40000;

        // Create material with custom position node
        const material = new THREE.MeshBasicNodeMaterial({
            transparent: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            side: THREE.DoubleSide
        });

        // Custom position node using Fn - adapted from p5.js sketch
        material.positionNode = Fn(() => {
            // Get instance index as float
            // In p5.js they loop from 30000 down to 0, so we reverse the index
            const i = float(sub(30000.0, float(instanceIndex)));
            
            // Time increment: t += PI/20
            const t = mul(time, 1.5); // Scale to match visual speed
            
            // Oscillatory horizontal component: k = 5 * cos(i/49) * cos(i/3690)
            const k = mul(mul(5.0, cos(div(i, 49.0))), cos(div(i, 3690.0)));
            
            // Vertical drift term: e = i/984 - 12
            const e = sub(div(i, 984.0), 12.0);
            
            // Radial magnitude scaling: d = pow(mag(k, e), 2) / 99 + 1
            const mag_ke = length(vec2(k, e));
            const d = add(div(pow(mag_ke, 2.0), 99.0), 1.0);
            
            // Angular component (3-fold symmetry): c = d - t/18 + (i % 3) * 4
            const i_mod_3 = mod(i, 3.0);
            const c = add(sub(d, div(t, 18.0)), mul(i_mod_3, 4.0));
            
            // Final coordinates with scale factor s = 1.4
            const s = 1.4;
            
            // x = s * (k * (4 + sin(d*18 - t*2 + (i%3)*2)) - 5 * sin(atan2(k, e) * 9) + 30 * sin(c)) + width/2
            const term1_x = mul(k, add(4.0, sin(add(sub(mul(d, 18.0), mul(t, 2.0)), mul(i_mod_3, 2.0)))));
            const term2_x = mul(5.0, sin(mul(atan2(k, e), 9.0)));
            const term3_x = mul(30.0, sin(c));
            
            const x = add(mul(s, add(sub(term1_x, term2_x), term3_x)), 250.0); // width/2 = 250
            
            // y = s * (80 * sin(c - d) + d * 79) + height/2 * 0.05
            // height/2 = 250, times 0.05 = 12.5
            const y = add(mul(s, add(mul(80.0, sin(sub(c, d))), mul(d, 79.0))), 12.5);
            
            // Convert to world space (-250 to 250) for orthographic camera
            const worldX = sub(x, 250.0);
            const worldY = sub(250.0, y);
            const worldZ = 0.0;
            
            return positionLocal.add(vec3(worldX, worldY, worldZ));
        })();

        // Set color and opacity
        material.colorNode = color(0xffffff);
        material.opacityNode = float(0.15);

        // Create instanced mesh
        const points = new THREE.InstancedMesh(geometry, material, startCount);
        scene.add(points);

        // Animation loop
        function animate() {
            renderer.render(scene, camera);
            ctrls.update();
        }

        // Handle window resize
        function handleWindowResize() {
            const size = Math.min(window.innerWidth, window.innerHeight, 500);
            camera.left = -250;
            camera.right = 250;
            camera.top = 250;
            camera.bottom = -250;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        window.addEventListener('resize', handleWindowResize, false);
        
        console.log('Adapted p5.js sketch running in Three.js TSL');
    </script>
</body>
</html>
