<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js TSL - Yuruyurau Style (Version 6)</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: black; }
        #info {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: rgba(255,255,255,0.7);
            font-family: 'Courier New', monospace;
            font-size: 14px;
            background: rgba(0,0,0,0.7);
            padding: 4px 12px;
            border-radius: 20px;
            z-index: 100;
        }
    </style>
    
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@v0.179.0/build/three.webgpu.js",
                "three/webgpu": "https://cdn.jsdelivr.net/npm/three@v0.179.0/build/three.webgpu.js",
                "three/tsl": "https://cdn.jsdelivr.net/npm/three@v0.179.0/build/three.tsl.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@v0.179.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="info">Three.js TSL | yuruyurau style | 20k points</div>

    <script type="module">
        import * as THREE from "three";
        import { OrbitControls } from "three/addons/controls/OrbitControls.js";
        import { 
            color, 
            positionLocal, 
            time, 
            vec3, 
            vec2,
            mod, 
            float, 
            Fn,
            sin,
            cos,
            length,
            pow,
            instanceIndex,
            mul,
            div,
            add,
            sub,
            PI
        } from "three/tsl";

        // Setup
        const w = window.innerWidth;
        const h = window.innerHeight;
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000000);

        // Orthographic camera for 2D-like rendering
        const camera = new THREE.OrthographicCamera(-250, 250, 250, -250, 0.1, 1000);
        camera.position.z = 500;
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGPURenderer({ antialias: true });
        renderer.setAnimationLoop(animate);
        renderer.setSize(w, h);
        renderer.setPixelRatio(2);
        document.body.appendChild(renderer.domElement);

        // Controls - disabled for this effect
        const ctrls = new OrbitControls(camera, renderer.domElement);
        ctrls.enableDamping = true;
        ctrls.enableZoom = false;
        ctrls.enablePan = false;
        ctrls.enableRotate = false;

        // Create geometry for points
        const pointSize = 1;
        const geometry = new THREE.PlaneGeometry(pointSize, pointSize);
        
        // Number of points (20,000 as in the p5.js sketch, looping from 20000 down)
        const startCount = 20000;

        // Create material with custom position node
        const material = new THREE.MeshBasicNodeMaterial({
            transparent: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            side: THREE.DoubleSide
        });

        // Custom position node using Fn - adapted from p5.js sketch
        material.positionNode = Fn(() => {
            // Get instance index as float (reverse to match i > 0 loop)
            const i = float(sub(20000.0, float(instanceIndex)));
            
            // y parameter from drawPoint(y, i) where y = i/99
            const y = div(i, 99.0);
            
            // Time: t += PI/65
            const t = mul(time, 2.0); // Scale to match visual speed
            
            // Base oscillation: k = 8 * cos(y)
            const k = mul(8.0, cos(y));
            
            // Vertical offset field: e = y/8 - 12
            const e = sub(div(y, 8.0), 12.0);
            
            // Strong nonlinear radial distortion
            // d = pow(mag(k, e), 3) / 999 + 1
            const mag_ke = length(vec2(k, e));
            const d = add(div(pow(mag_ke, 3.0), 999.0), 1.0);
            
            // Radial quantity
            // q = 79 - e*sin(k) + (k/d) * (8 + 4*sin(d*d - t + cos(e + t/2)))
            const term1 = float(79.0);
            const term2 = mul(e, sin(k));
            
            const innerSin = sin(add(sub(mul(d, d), t), cos(add(e, div(t, 2.0)))));
            const term3 = mul(div(k, d), add(8.0, mul(4.0, innerSin)));
            
            const q = add(sub(term1, term2), term3);
            
            // Angular coordinate (2-phase symmetry)
            // c = d/2 + (e/99)*sin(t + d) - t/8 + (i%2)*3
            const i_mod_2 = mod(i, 2.0);
            const c = add(
                add(
                    div(d, 2.0),
                    mul(div(e, 99.0), sin(add(t, d)))
                ),
                sub(mul(i_mod_2, 3.0), div(t, 8.0))
            );
            
            // Final Cartesian coordinates with scale s = 1.15
            const s = 1.15;
            
            // x = s * q * sin(c) + width/2
            const x = add(mul(mul(s, q), sin(c)), 250.0);
            
            // yPos = s * (q + 40) * cos(c) + height/2
            const yPos = add(mul(mul(s, add(q, 40.0)), cos(c)), 250.0);
            
            // Convert to world space (-250 to 250) for orthographic camera
            const worldX = sub(x, 250.0);
            const worldY = sub(250.0, yPos);
            const worldZ = 0.0;
            
            return positionLocal.add(vec3(worldX, worldY, worldZ));
        })();

        // Set color and opacity
        material.colorNode = color(0xffffff);
        material.opacityNode = float(0.12);

        // Create instanced mesh
        const points = new THREE.InstancedMesh(geometry, material, startCount);
        scene.add(points);

        // Animation loop
        function animate() {
            renderer.render(scene, camera);
            ctrls.update();
        }

        // Handle window resize
        function handleWindowResize() {
            const size = Math.min(window.innerWidth, window.innerHeight, 500);
            camera.left = -250;
            camera.right = 250;
            camera.top = 250;
            camera.bottom = -250;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        window.addEventListener('resize', handleWindowResize, false);
        
        console.log('Adapted p5.js sketch (version 6) running in Three.js TSL');
    </script>
</body>
</html>
