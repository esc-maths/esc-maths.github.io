<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js TSL - Inner Oscillation Pattern</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: black; }
        #info {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: rgba(255,255,255,0.7);
            font-family: 'Courier New', monospace;
            font-size: 14px;
            background: rgba(0,0,0,0.7);
            padding: 4px 12px;
            border-radius: 20px;
            z-index: 100;
        }
    </style>
    
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@v0.183.2/build/three.webgpu.js",
                "three/webgpu": "https://cdn.jsdelivr.net/npm/three@v0.183.2/build/three.webgpu.js",
                "three/tsl": "https://cdn.jsdelivr.net/npm/three@v0.183.2/build/three.tsl.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@v0.183.2/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="info">Three.js TSL | inner oscillation | 10k points</div>

    <script type="module">
        import * as THREE from "three";
        import { OrbitControls } from "three/addons/controls/OrbitControls.js";
        import { 
            color, 
            positionLocal, 
            time, 
            vec3, 
            vec2,
            mod, 
            float, 
            Fn,
            sin,
            cos,
            length,
            instanceIndex,
            mul,
            div,
            add,
            sub,
            PI
        } from "three/tsl";

        // Setup
        const w = window.innerWidth;
        const h = window.innerHeight;
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x090909); // background(9)

        // Orthographic camera for 2D-like rendering
        const aspect = window.innerWidth / window.innerHeight;
        const viewSize = 500;

        const camera = new THREE.OrthographicCamera(
            -viewSize * aspect / 2,
            viewSize * aspect / 2,
            viewSize / 2,
            -viewSize / 2,
            0.1,
            1000
        );
        camera.position.z = 500;
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGPURenderer({ antialias: true });
        renderer.setAnimationLoop(animate);
        renderer.setSize(w, h);
        renderer.setPixelRatio(2);
        document.body.appendChild(renderer.domElement);

        // Controls - disabled for this effect
        const ctrls = new OrbitControls(camera, renderer.domElement);
        ctrls.enableDamping = true;
        ctrls.enableZoom = false;
        ctrls.enablePan = false;
        ctrls.enableRotate = false;

        // Create geometry for points
        const pointSize = 1.2;
        const geometry = new THREE.PlaneGeometry(pointSize, pointSize);
        
        // Number of points
        const startCount = 12000;

        // Create material with custom position node
        const material = new THREE.MeshBasicNodeMaterial({
            transparent: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            side: THREE.DoubleSide
        });

        // Custom position node
        material.positionNode = Fn(() => {
            // Get instance index as float
            const i = float(instanceIndex);
            
            // Parameters: x = i, y = i/235
            const x = i;
            const y = div(i, 235.0);
            
            // Time: t += PI/150 (very slow)
            const t = mul(time, 0.4);
            
            // Core structure
            // k = (4 + cos(x/9 - t)) * cos(x/30)
            const k = mul(
                add(4.0, cos(sub(div(x, 9.0), t))),
                cos(div(x, 30.0))
            );
            
            // e = y/7 - 13
            const e = sub(div(y, 7.0), 13.0);
            
            // d = mag(k, e) + sin(y/99 + t/2) - 4
            const d = add(
                sub(
                    length(vec2(k, e)),
                    4.0
                ),
                sin(add(div(y, 99.0), div(t, 2.0)))
            );
            
            // Inner oscillatory term
            // innerOsc = 9 + 2*sin(cos(e)*9 - d*4 + t)
            const innerOsc = add(
                9.0,
                mul(
                    2.0,
                    sin(add(sub(mul(cos(e), 9.0), mul(d, 4.0)), t))
                )
            );
            
            // q = 3*sin(k*2) + sin(y/29) * k * innerOsc
            const q = add(
                mul(3.0, sin(mul(k, 2.0))),
                mul(mul(sin(div(y, 29.0)), k), innerOsc)
            );
            
            // c = d - t
            const c = sub(d, t);
            
            // Scale factor
            const s = 1.3;
            
            // Final coordinates
            // px = s * (q + 40*cos(c)) + 250
            const px = add(mul(s, add(q, mul(40.0, cos(c)))), 250.0);
            
            // py = s * (q*sin(c) + d*35)
            const py = mul(s, add(mul(q, sin(c)), mul(d, 35.0)));
            
            // Convert to world space (-250 to 250)
            const worldX = sub(px, 250.0);
            const worldY = sub(250.0, py);
            const worldZ = 0.0;
            
            return positionLocal.add(vec3(worldX, worldY, worldZ));
        })();

        // Set color and opacity - stroke(255, 96)
        material.colorNode = color(0xffffff);
        material.opacityNode = float(0.38);

        // Create instanced mesh
        const points = new THREE.InstancedMesh(geometry, material, startCount);
        scene.add(points);

        // Animation loop
        function animate() {
            renderer.render(scene, camera);
            ctrls.update();
        }

        // Handle window resize
        function handleWindowResize() {
            const w = window.innerWidth;
            const h = window.innerHeight;
            const aspect = w / h;
            const viewSize = 500;

            camera.left = -viewSize * aspect / 2;
            camera.right = viewSize * aspect / 2;
            camera.top = viewSize / 2;
            camera.bottom = -viewSize / 2;

            camera.updateProjectionMatrix();

            renderer.setSize(w, h);
        }
        window.addEventListener('resize', handleWindowResize, false);
        
        console.log('Inner oscillation pattern running');
    </script>
</body>
</html>
