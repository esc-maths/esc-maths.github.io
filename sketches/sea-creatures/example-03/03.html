<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js TSL - Yuruyurau Style - Example 3</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: black; }
        #info {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: rgba(255,255,255,0.7);
            font-family: 'Courier New', monospace;
            font-size: 14px;
            background: rgba(0,0,0,0.7);
            padding: 4px 12px;
            border-radius: 20px;
            z-index: 100;
        }
    </style>
    
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@v0.179.0/build/three.webgpu.js",
                "three/webgpu": "https://cdn.jsdelivr.net/npm/three@v0.179.0/build/three.webgpu.js",
                "three/tsl": "https://cdn.jsdelivr.net/npm/three@v0.179.0/build/three.tsl.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@v0.179.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="info">Three.js TSL | yuruyurau style | 40k points</div>

    <script type="module">
        import * as THREE from "three";
        import { OrbitControls } from "three/addons/controls/OrbitControls.js";
        import { 
            color, 
            positionLocal, 
            screenUV, 
            range, 
            time, 
            vec3, 
            vec2,
            mod, 
            float, 
            uv, 
            pass,
            Fn,
            sin,
            cos,
            length,
            floor,
            instanceIndex,
            mul,
            div,
            add,
            sub
        } from "three/tsl";

        // Setup
        const w = window.innerWidth;
        const h = window.innerHeight;
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000000);

        // Orthographic camera for 2D-like rendering
        const camera = new THREE.OrthographicCamera(-250, 250, 250, -250, 0.1, 1000);
        camera.position.z = 500;
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGPURenderer({ antialias: true });
        renderer.setAnimationLoop(animate);
        renderer.setSize(w, h);
        renderer.setPixelRatio(2);
        document.body.appendChild(renderer.domElement);

        // Controls - disabled for this effect
        const ctrls = new OrbitControls(camera, renderer.domElement);
        ctrls.enableDamping = true;
        ctrls.enableZoom = false;
        ctrls.enablePan = false;
        ctrls.enableRotate = false;

        // Create geometry for points
        const pointSize = 1;
        const geometry = new THREE.PlaneGeometry(pointSize, pointSize);
        
        // Number of points
        const startCount = 40000;

        // Create material with custom position node
        const material = new THREE.MeshBasicNodeMaterial({
            transparent: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            side: THREE.DoubleSide
        });

        // Custom position node using Fn
        material.positionNode = Fn(() => {
            // Get instance index as float
            const i = float(instanceIndex);
            
            // Calculate x and y from index
            // x = (i / 4) % 100
            // y = floor(i / 150)
            const x = mod(div(i, 4.0), 100.0);
            const y = floor(div(i, 150.0));
            
            // Original drawPoint calculations
            const k = sub(div(x, 4.0), 12.5);
            const e = sub(div(y, 9.0), 9.0);
            
            const o = div(length(vec2(k, e)), 9.0);
            
            // Time (scaled to match original speed)
            const t = mul(time, 2.0);
            
            const c = sub(div(mul(o, e), 30.0), div(t, 8.0));
            
            const eps = 0.000001;
            
            // q = x + 99 + cos(9/(k+eps)) + o*k*(cos(9*e)/3 + cos(y)/0.7) * sin(4*o - t)
            const term1 = add(x, 99.0);
            const term2 = cos(div(9.0, add(k, eps)));
            
            const innerCos = add(div(cos(mul(e, 9.0)), 3.0), div(cos(y), 0.7));
            const term3 = mul(mul(mul(o, k), innerCos), sin(sub(mul(o, 4.0), t)));
            
            const q = add(add(term1, term2), term3);
            
            // px = 0.9 * q * sin(c) + 250
            const px = add(mul(mul(0.9, q), sin(c)), 250.0);
            
            // py = 250 + (y/3.6)*cos(3*c - t/2) - (q/2)*cos(c)
            const py = sub(
                add(250.0, mul(div(y, 3.6), cos(sub(mul(c, 3.0), div(t, 2.0))))),
                mul(div(q, 2.0), cos(c))
            );
            
            // Convert to world space (-250 to 250) for orthographic camera
            const worldX = sub(px, 250.0);
            const worldY = sub(250.0, py);
            const worldZ = 0.0;
            
            return positionLocal.add(vec3(worldX, worldY, worldZ));
        })();

        // Set color and opacity
        material.colorNode = color(0xffffff);
        material.opacityNode = float(0.1);

        // Create instanced mesh
        const points = new THREE.InstancedMesh(geometry, material, startCount);
        scene.add(points);

        // Animation loop
        function animate() {
            renderer.render(scene, camera);
            ctrls.update();
        }

        // Handle window resize
        function handleWindowResize() {
            const size = Math.min(window.innerWidth, window.innerHeight, 500);
            camera.left = -250;
            camera.right = 250;
            camera.top = 250;
            camera.bottom = -250;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        window.addEventListener('resize', handleWindowResize, false);
        
        console.log('Three.js TSL with fixed syntax running');
    </script>
</body>
</html>
