<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js TSL - Yuruyurau Style - Example 5</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: black; }
        #info {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: rgba(255,255,255,0.7);
            font-family: 'Courier New', monospace;
            font-size: 14px;
            background: rgba(0,0,0,0.7);
            padding: 4px 12px;
            border-radius: 20px;
            z-index: 100;
        }
    </style>
    
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@v0.183.2/build/three.webgpu.js",
                "three/webgpu": "https://cdn.jsdelivr.net/npm/three@v0.183.2/build/three.webgpu.js",
                "three/tsl": "https://cdn.jsdelivr.net/npm/three@v0.183.2/build/three.tsl.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@v0.183.2/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="info">Three.js TSL | yuruyurau style | 20k points</div>

    <script type="module">
        import * as THREE from "three";
        import { OrbitControls } from "three/addons/controls/OrbitControls.js";
        import { 
            color, 
            positionLocal, 
            time, 
            vec3, 
            vec2,
            mod, 
            float, 
            Fn,
            sin,
            cos,
            length,
            step,
            instanceIndex,
            mul,
            div,
            add,
            sub,
            PI
        } from "three/tsl";

        // Setup
        const w = window.innerWidth;
        const h = window.innerHeight;
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000000);

        // Orthographic camera for 2D-like rendering
        const camera = new THREE.OrthographicCamera(-250, 250, 250, -250, 0.1, 1000);
        camera.position.z = 500;
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGPURenderer({ antialias: true });
        renderer.setAnimationLoop(animate);
        renderer.setSize(w, h);
        renderer.setPixelRatio(2);
        document.body.appendChild(renderer.domElement);

        // Controls - disabled for this effect
        const ctrls = new OrbitControls(camera, renderer.domElement);
        ctrls.enableDamping = true;
        ctrls.enableZoom = false;
        ctrls.enablePan = false;
        ctrls.enableRotate = false;

        // Create geometry for points
        const pointSize = 1.5;
        const geometry = new THREE.PlaneGeometry(pointSize, pointSize);
        
        // Number of points  
        const startCount = 20000;

        // Create material with custom position node
        const material = new THREE.MeshBasicNodeMaterial({
            transparent: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            side: THREE.DoubleSide
        });

        // Custom position node using Fn - adapted from p5.js sketch
        material.positionNode = Fn(() => {
            // Get instance index as float (matching for loop: i = 20000; i--;)
            const i = float(sub(20000.0, float(instanceIndex)));
            
            // y parameter from drawPoint(i/600, CX, CY)
            const y = div(i, 600.0);
            
            // Time: t += PI/45
            const t = mul(time, 1.8); // Scale to match visual speed
            
            // Scaled cosine term with conditional: cos(y*5) * (y < 11 ? 21 : 11)
            const threshold = 11.0;
            
            const k_low = float(21.0);
            const k_high = float(11.0);
            
            // Use step for conditional
            const isHigh = step(threshold, y); // 1 if y >= threshold
            const isLow = sub(1.0, isHigh); // 1 if y < threshold
            
            const k_amp = add(mul(isLow, k_low), mul(isHigh, k_high));
            const k = mul(cos(mul(y, 5.0)), k_amp);
            
            // Linear offset: e = y/8 - 13
            const e = sub(div(y, 8.0), 13.0);
            
            // Radial magnitude: o = mag(k, e) / 6
            const o = div(length(vec2(k, e)), 6.0);
            
            // Add small epsilon to avoid division by zero in cos(19/k)
            const eps = 0.0001;
            
            // Radius modulation
            // q = k*3 + 49 + cos(19/k) + k*cos(y/2) * (1 + sin(o*4 - e*2 - t))
            const term1 = mul(k, 3.0);
            const term2 = float(49.0);
            const term3 = cos(div(19.0, add(k, eps)));
            
            const innerSin = sin(sub(sub(mul(o, 4.0), mul(e, 2.0)), t));
            const term4 = mul(mul(k, cos(div(y, 2.0))), add(1.0, innerSin));
            
            const q = add(add(add(term1, term2), term3), term4);
            
            // Angular parameter (depends on i)
            // c = o/1.5 - e/5 - t/8 + (i%3)*8
            const i_mod_3 = mod(i, 3.0);
            const c = add(
                sub(
                    div(o, 1.5),
                    div(e, 5.0)
                ),
                sub(mul(i_mod_3, 8.0), div(t, 8.0))
            );
            
            // Scale factor
            const s = 1.3;
            
            // Final coordinates
            // x = s * q * sin(c) + CX (CX = width/2 = 250)
            // yPos = s * (q * cos(c) - 79 * sin(c/3)) + CY (CY = height/2 = 250)
            const x = add(mul(mul(s, q), sin(c)), 250.0);
            const yPos = add(
                mul(
                    s,
                    sub(
                        mul(q, cos(c)),
                        mul(79.0, sin(div(c, 3.0)))
                    )
                ),
                250.0
            );
            
            // Convert to world space (-250 to 250) for orthographic camera
            const worldX = sub(x, 250.0);
            const worldY = sub(250.0, yPos);
            const worldZ = 0.0;
            
            return positionLocal.add(vec3(worldX, worldY, worldZ));
        })();

        // Set color and opacity
        material.colorNode = color(0xffffff);
        material.opacityNode = float(0.2);

        // Create instanced mesh
        const points = new THREE.InstancedMesh(geometry, material, startCount);
        scene.add(points);

        // Animation loop
        function animate() {
            renderer.render(scene, camera);
            ctrls.update();
        }

        // Handle window resize
        function handleWindowResize() {
            const size = Math.min(window.innerWidth, window.innerHeight, 500);
            camera.left = -250;
            camera.right = 250;
            camera.top = 250;
            camera.bottom = -250;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        window.addEventListener('resize', handleWindowResize, false);
        
        console.log('Adapted p5.js sketch running in Three.js TSL');
    </script>
</body>
</html>
