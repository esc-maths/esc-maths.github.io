<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js TSL - Step 1</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: black; }
        #info {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: rgba(255,255,255,0.7);
            font-family: 'Courier New', monospace;
            font-size: 14px;
            background: rgba(0,0,0,0.7);
            padding: 4px 12px;
            border-radius: 20px;
            z-index: 100;
        }
    </style>
    
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@v0.179.0/build/three.webgpu.js",
                "three/webgpu": "https://cdn.jsdelivr.net/npm/three@v0.179.0/build/three.webgpu.js",
                "three/tsl": "https://cdn.jsdelivr.net/npm/three@v0.179.0/build/three.tsl.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@v0.179.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="info">Step 1</div>

    <script type="module">
        import * as THREE from "three";
        import { OrbitControls } from "three/addons/controls/OrbitControls.js";
        import { 
            color, 
            positionLocal, 
            time, 
            vec3, 
            vec2,
            mod, 
            float, 
            Fn,
            sin,
            cos,
            length,
            floor,
            instanceIndex,
            mul,
            div,
            add,
            sub,
            atan2
        } from "three/tsl";

        // Setup
        const w = window.innerWidth;
        const h = window.innerHeight;
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000000);

        // Orthographic camera for 2D-like rendering
        const camera = new THREE.OrthographicCamera(-250, 250, 250, -250, 0.1, 1000);
        camera.position.z = 500;
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGPURenderer({ antialias: true });
        renderer.setAnimationLoop(animate);
        renderer.setSize(w, h);
        renderer.setPixelRatio(2);
        document.body.appendChild(renderer.domElement);

        // Controls - disabled for this effect
        const ctrls = new OrbitControls(camera, renderer.domElement);
        ctrls.enableDamping = true;
        ctrls.enableZoom = false;
        ctrls.enablePan = false;
        ctrls.enableRotate = false;

        // Create geometry for points
        const pointSize = 1.5;
        const geometry = new THREE.PlaneGeometry(pointSize, pointSize);
        
        // Number of points
        const startCount = 20000;

        // Create material with custom position node
        const material = new THREE.MeshBasicNodeMaterial({
            transparent: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            side: THREE.DoubleSide
        });

        // Custom position node
        material.positionNode = Fn(() => {
            // Get instance index as float
            const i = float(instanceIndex);
            
            // Grid sampling
            const x = mod(i, 200.0);
            const y = floor(div(i, 200.0));
            
            // Time
            const t = mul(time, 0.8);
            
            // Center coordinates
            const k = sub(x, 100.0);
            const e = sub(y, 50.0);
            
            // Distance from center
            const o = div(length(vec2(k, e)), 50.0);
            
            // Simple angle calculation using normalizing the vector
            const len = length(vec2(k, e));
            const nx = div(k, add(len, 0.0001));
            const ny = div(e, add(len, 0.0001));
            
            // Circular pattern - use normalized coordinates directly
            const px = add(250.0, mul(add(k, mul(mul(o, 10.0), nx)), 2.0));
            const py = add(250.0, mul(add(e, mul(mul(o, 10.0), ny)), 2.0));
            
            // Convert to world space
            const worldX = sub(px, 250.0);
            const worldY = sub(250.0, py);
            const worldZ = 0.0;
            
            return positionLocal.add(vec3(worldX, worldY, worldZ));
        })();

        // Set color and opacity
        material.colorNode = color(0xffffff);
        material.opacityNode = float(0.15);

        // Create instanced mesh
        const points = new THREE.InstancedMesh(geometry, material, startCount);
        scene.add(points);

        // Animation loop
        function animate() {
            renderer.render(scene, camera);
            ctrls.update();
        }

        // Handle window resize
        function handleWindowResize() {
            camera.left = -250;
            camera.right = 250;
            camera.top = 250;
            camera.bottom = -250;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        window.addEventListener('resize', handleWindowResize, false);
        
        console.log('Simple circular pattern running');
    </script>
</body>
</html>
