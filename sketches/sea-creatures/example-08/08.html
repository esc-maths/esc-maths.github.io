<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js TSL - Complex Pattern</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: black; }
        #info {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: rgba(255,255,255,0.7);
            font-family: 'Courier New', monospace;
            font-size: 14px;
            background: rgba(0,0,0,0.7);
            padding: 4px 12px;
            border-radius: 20px;
            z-index: 100;
        }
    </style>
    
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@v0.183.2/build/three.webgpu.js",
                "three/webgpu": "https://cdn.jsdelivr.net/npm/three@v0.183.2/build/three.webgpu.js",
                "three/tsl": "https://cdn.jsdelivr.net/npm/three@v0.183.2/build/three.tsl.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@v0.183.2/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="info">Three.js TSL | yuruyurau style | 15k points</div>

    <script type="module">
        import * as THREE from "three";
        import { OrbitControls } from "three/addons/controls/OrbitControls.js";
        import { 
            color, 
            positionLocal, 
            time, 
            vec3, 
            vec2,
            mod, 
            float, 
            Fn,
            sin,
            cos,
            length,
            sqrt,
            step,
            instanceIndex,
            mul,
            div,
            add,
            sub,
            PI
        } from "three/tsl";

        // Setup
        const w = window.innerWidth;
        const h = window.innerHeight;
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000000);

        // Orthographic camera for 2D-like rendering
        const aspect = window.innerWidth / window.innerHeight;
        const viewSize = 500;

        const camera = new THREE.OrthographicCamera(
            -viewSize * aspect / 2,
            viewSize * aspect / 2,
            viewSize / 2,
            -viewSize / 2,
            0.1,
            1000
        );
        camera.position.z = 500;
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGPURenderer({ antialias: true });
        renderer.setAnimationLoop(animate);
        renderer.setSize(w, h);
        renderer.setPixelRatio(2);
        document.body.appendChild(renderer.domElement);

        // Controls - disabled for this effect
        const ctrls = new OrbitControls(camera, renderer.domElement);
        ctrls.enableDamping = true;
        ctrls.enableZoom = false;
        ctrls.enablePan = false;
        ctrls.enableRotate = false;

        // Create geometry for points
        const pointSize = 1;
        const geometry = new THREE.PlaneGeometry(pointSize, pointSize);
        
        // Number of points (10,500 as in the p5.js sketch, looping from 10500 down)
        const startCount = 15000;

        // Create material with custom position node
        const material = new THREE.MeshBasicNodeMaterial({
            transparent: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            side: THREE.DoubleSide
        });

        // Custom position node
        material.positionNode = Fn(() => {
            // Get instance index as float (reverse to match i > 0 loop)
            const i = float(sub(10500.0, float(instanceIndex)));
            
            // y parameter: y = i / 345
            const y = div(i, 345.0);
            
            // Time: t += PI/130
            const t = mul(time, 0.6);
            
            // Conditional for k based on y threshold
            const threshold = 11.0;
            
            // Calculate k for y < 11
            // k_low = (6 + sin(y) * 9) * cos(i - t/4)
            const sin_y = sin(y);
            const term_low = add(6.0, mul(sin_y, 9.0));
            const k_low = mul(term_low, cos(sub(i, div(t, 4.0))));
            
            // Calculate k for y >= 11
            // k_high = (y/5 + cos(y/2)) * cos(i - t/4)
            const term_high = add(div(y, 5.0), cos(div(y, 2.0)));
            const k_high = mul(term_high, cos(sub(i, div(t, 4.0))));
            
            // Use step for conditional
            const isHigh = step(threshold, y); // 1 if y >= threshold
            const isLow = sub(1.0, isHigh); // 1 if y < threshold
            
            const k = add(mul(isLow, k_low), mul(isHigh, k_high));
            
            // e = y/7 - 13
            const e = sub(div(y, 7.0), 13.0);
            
            // d = hypot(k, e) + sin(e/4 + t)/6
            // hypot = sqrt(k^2 + e^2)
            const k2 = mul(k, k);
            const e2 = mul(e, e);
            const hypot_val = sqrt(add(k2, e2));
            const d = add(hypot_val, div(sin(add(div(e, 4.0), t)), 6.0));
            
            // q = y * k / d * (3 + sin(d*2 + y/2 - t*4))
            const term_q1 = div(mul(y, k), add(d, 0.0001)); // Add epsilon to avoid division by zero
            const sin_term = sin(add(sub(mul(d, 2.0), mul(t, 4.0)), div(y, 2.0)));
            const term_q2 = add(3.0, sin_term);
            const q = mul(term_q1, term_q2);
            
            // c = d/2 + 1 - t/2
            const c = add(sub(div(d, 2.0), div(t, 2.0)), 1.0);
            
            // Final coordinates
            // x = q + 50*cos(c) + 250
            const x = add(add(q, mul(50.0, cos(c))), 250.0);
            
            // yCoord = q * sin(c) + d*29 - 150
            const yCoord = add(sub(mul(q, sin(c)), 150.0), mul(d, 29.0));
            
            // Convert to world space (-250 to 250)
            const worldX = sub(x, 250.0);
            const worldY = sub(250.0, yCoord);
            const worldZ = 0.0;
            
            return positionLocal.add(vec3(worldX, worldY, worldZ));
        })();

        // Set color and opacity
        material.colorNode = color(0xffffff);
        material.opacityNode = float(0.12);

        // Create instanced mesh
        const points = new THREE.InstancedMesh(geometry, material, startCount);
        scene.add(points);

        // Animation loop
        function animate() {
            renderer.render(scene, camera);
            ctrls.update();
        }

        // Handle window resize
        function handleWindowResize() {
            const w = window.innerWidth;
            const h = window.innerHeight;
            const aspect = w / h;
            const viewSize = 500;

            camera.left = -viewSize * aspect / 2;
            camera.right = viewSize * aspect / 2;
            camera.top = viewSize / 2;
            camera.bottom = -viewSize / 2;

            camera.updateProjectionMatrix();

            renderer.setSize(w, h);
        }
        window.addEventListener('resize', handleWindowResize, false);
        
        console.log('Complex pattern running');
    </script>
</body>
</html>
