<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js TSL - Yuruyurau Style - Example 2</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: black; }
        #info {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: rgba(255,255,255,0.7);
            font-family: 'Courier New', monospace;
            font-size: 14px;
            background: rgba(0,0,0,0.7);
            padding: 4px 12px;
            border-radius: 20px;
            z-index: 100;
        }
    </style>
    
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@v0.183.2/build/three.webgpu.js",
                "three/webgpu": "https://cdn.jsdelivr.net/npm/three@v0.183.2/build/three.webgpu.js",
                "three/tsl": "https://cdn.jsdelivr.net/npm/three@v0.183.2/build/three.tsl.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@v0.183.2/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="info">Three.js TSL | yuruyurau style | 40k points </div>

    <script type="module">
        import * as THREE from "three";
        import { OrbitControls } from "three/addons/controls/OrbitControls.js";
        import { 
            color, 
            positionLocal, 
            time, 
            vec3, 
            vec2,
            mod, 
            float, 
            Fn,
            sin,
            cos,
            length,
            instanceIndex,
            mul,
            div,
            add,
            sub,
            PI
        } from "three/tsl";

        // Setup
        const w = window.innerWidth;
        const h = window.innerHeight;
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000000);

        // Orthographic camera for 2D-like rendering
        const camera = new THREE.OrthographicCamera(-250, 250, 250, -250, 0.1, 1000);
        camera.position.z = 500;
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGPURenderer({ antialias: true });
        renderer.setAnimationLoop(animate);
        renderer.setSize(w, h);
        renderer.setPixelRatio(2);
        document.body.appendChild(renderer.domElement);

        // Controls - disabled for this effect
        const ctrls = new OrbitControls(camera, renderer.domElement);
        ctrls.enableDamping = true;
        ctrls.enableZoom = false;
        ctrls.enablePan = false;
        ctrls.enableRotate = false;

        // Create geometry for points
        const pointSize = 1;
        const geometry = new THREE.PlaneGeometry(pointSize, pointSize);
        
        // Number of points 
        const startCount = 40000;

        // Create material with custom position node
        const material = new THREE.MeshBasicNodeMaterial({
            transparent: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            side: THREE.DoubleSide
        });

        // Custom position node using Fn - adapted from p5.js sketch
        material.positionNode = Fn(() => {
            // Get instance index as float
            const i = float(instanceIndex);
            
            // Calculate x and y from index
            // x = (i / 2) % 100
            // y = i / 350
            const x = mod(div(i, 2.0), 100.0);
            const y = div(i, 350.0);
            
            // Time: time += PI/60
            const t = mul(time, 1.0); // Scale to match visual speed
            
            // Normalised auxiliary variables
            // k = x/4 - 12.5
            const k = sub(div(x, 4.0), 12.5);
            
            // e = y/9 + 9
            const e = add(div(y, 9.0), 9.0);
            
            // Magnitude-based oscillation: o = mag(k, e) / 9
            const o = div(length(vec2(k, e)), 9.0);
            
            // Intermediate x-offset
            // q = x + 39 + y + 1/k + o*k*(cos(y)/4 + cos(e)) * sin(o*4 - time)
            // Add small epsilon to avoid division by zero in 1/k
            const eps = 0.0001;
            const term1 = add(add(x, 39.0), y);
            const term2 = div(1.0, add(k, eps));
            const innerCos = add(div(cos(y), 4.0), cos(e));
            const term3 = mul(mul(mul(o, k), innerCos), sin(sub(mul(o, 4.0), t)));
            
            const q = add(add(term1, term2), term3);
            
            // Phase used by trig functions
            // c = o + e/99 - time/8 + (index % 2) * 3
            const i_mod_2 = mod(i, 2.0);
            const c = add(sub(add(o, div(e, 99.0)), div(t, 8.0)), mul(i_mod_2, 3.0));
            
            // Final screen coordinates
            // px = q * 1.1 * sin(c) + 250
            const px = add(mul(mul(q, 1.1), sin(c)), 250.0);
            
            // py = 1.3 * ( (y/2) * cos(c*4 - o) - (q/2) * cos(c) ) + 250
            const term_y1 = mul(div(y, 2.0), cos(sub(mul(c, 4.0), o)));
            const term_y2 = mul(div(q, 2.0), cos(c));
            const py = add(mul(1.3, sub(term_y1, term_y2)), 250.0);
            
            // Convert to world space (-250 to 250) for orthographic camera
            const worldX = sub(px, 250.0);
            const worldY = sub(250.0, py);
            const worldZ = 0.0;
            
            return positionLocal.add(vec3(worldX, worldY, worldZ));
        })();

        // Set color and opacity
        material.colorNode = color(0xffffff);
        material.opacityNode = float(0.1);

        // Create instanced mesh
        const points = new THREE.InstancedMesh(geometry, material, startCount);
        scene.add(points);

        // Animation loop
        function animate() {
            renderer.render(scene, camera);
            ctrls.update();
        }

        // Handle window resize
        function handleWindowResize() {
            const size = Math.min(window.innerWidth, window.innerHeight, 500);
            camera.left = -250;
            camera.right = 250;
            camera.top = 250;
            camera.bottom = -250;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        window.addEventListener('resize', handleWindowResize, false);
        
        console.log('Adapted p5.js sketch running in Three.js TSL');
    </script>
</body>
</html>
