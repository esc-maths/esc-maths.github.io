<!doctype html>
<html class="no-js" lang="en">

<head>
    <title></title>
    <meta charset="utf-8" />
    <meta name="google" value="notranslate" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

    <meta name="description"
        content="Come and party with Pablo the Flamingo! Whatever you do, don't stop the music... Made by Nathan Gordon and art directed by Pascal Van Der Haar. Illustration by Jono Yuen. Built on MatterJs, ThreeJs and GSAP." />
    <meta name="keywords"
        content="Pablo the Flamingo, Nathan Gordon, Pascal Van Der Haar, gordonnl, pascalsetsail, Pablo, Flamingo, Matterjs, Threejs, GSAP" />

    <meta name="author" content="Nathan Gordon and Pascal Van Der Haar" />
    <meta name="copyright" content="2014" />
    <meta name="application-name" content="Pablo the Flamingo" />

    <link rel="icon" href="assets/img/favicon.ico" />

    <link href="assets/css/style.css" rel="stylesheet" media="screen" />

    <script src="assets/js/lib/modernizr.custom.js"></script>
    <script src="assets/js/lib/detectizr.min.js"></script>
</head>

<body>
    <div class="scene">
        <img class="logo" src="assets/img/img-logo.png">
        <nav>
            <div class="prompt mute-prompt">
                <div class="button icons">&#xe002;</div>
                <span class="label">Sound | on</span>
            </div>

            <a class="prompt share-prompt" href="https://pablotheflamingo.com/" target="_blank">
                <div class="button icons">&#xe000;</div>
                <span class="label">Visit original site</span>
            </a>

        </nav>
    </div>
    <div class="loading">
        <div class="mask">
            <img class="intro-logo" src="assets/img/img-logo.png">
            <img class="egg" src="assets/img/img-egg.png">
            <img class="egg-shadow" src="assets/img/img-egg_shadow.png">
        </div>
        <div class="load-mobile-prompt">Touch to start!</div>
        <div class="load-progress">Turn up your sound...<div class="red">Turn up your sound...</div>
        </div>
        <img class="loader" src="assets/img/img-loader.png">
    </div>
    <div class="scripts">
        <script data-main="assets/js/app.min.js?v=0.3" src="assets/js/lib/require.js"></script>

    </div>
</body>

</html>
