<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Black Hole – Screen Space</title>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.180.0/build/three.module.min.js"
  }
}
</script>

<style>
html, body {
  margin: 0;
  padding: 0;
  overflow: hidden;
  background: black;
}
canvas { display: block; }
</style>
</head>

<body>
<canvas id="c"></canvas>

<script type="module">
import * as THREE from 'three';

/* ================= THREE SETUP ================= */

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(2, devicePixelRatio));

const scene = new THREE.Scene();
const camera = new THREE.OrthographicCamera(-1,1,1,-1,0,1);

/* ================= SHADER ================= */

const material = new THREE.ShaderMaterial({
  uniforms: {
    uTime: { value: 0 },
    uRes: { value: new THREE.Vector2(innerWidth, innerHeight) }
  },
  vertexShader: `
    void main() {
      gl_Position = vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    precision highp float;

    uniform float uTime;
    uniform vec2 uRes;

    // smooth noise
    float noise(vec2 p) {
      return sin(p.x)*sin(p.y);
    }

    vec3 stars(vec2 uv) {
      float n = noise(uv * 40.0);
      float s = smoothstep(0.95, 1.0, n);
      return vec3(s);
    }

    void main() {
      // normalized coordinates
      vec2 uv = (gl_FragCoord.xy - 0.5 * uRes) / uRes.y;
      float r = length(uv);

      // gravitational lensing
      float bend = 0.35 / (r*r + 0.05);
      vec2 bentUV = uv + normalize(uv) * bend;

      // background stars
      vec3 col = stars(bentUV + uTime * 0.02);

      // accretion disc
      float disc =
        smoothstep(0.35, 0.32, abs(uv.y)) *
        smoothstep(0.20, 0.35, r) *
        smoothstep(0.80, 0.50, r);

      float swirl = sin(atan(uv.y, uv.x) * 12.0 + uTime * 2.0);
      vec3 discCol = vec3(1.0, 0.5, 0.15) * (swirl * 0.5 + 0.5);

      col += discCol * disc * 1.2;

      // photon ring
      float ring = smoothstep(0.28, 0.26, r) * smoothstep(0.22, 0.24, r);
      col += vec3(1.0, 0.9, 0.5) * ring * 1.5;

      // event horizon
      float horizon = smoothstep(0.18, 0.21, r);
      col *= horizon;

      gl_FragColor = vec4(col, 1.0);
    }
  `
});

/* ================= QUAD ================= */

scene.add(new THREE.Mesh(
  new THREE.PlaneGeometry(2,2),
  material
));

/* ================= LOOP ================= */

const clock = new THREE.Clock();

function animate() {
  material.uniforms.uTime.value = clock.getElapsedTime();
  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}
animate();

addEventListener('resize', () => {
  renderer.setSize(innerWidth, innerHeight);
  material.uniforms.uRes.value.set(innerWidth, innerHeight);
});
</script>
</body>
</html>
