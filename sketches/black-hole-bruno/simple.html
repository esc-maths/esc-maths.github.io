<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Black Hole - Screen Space</title>

  <style>
    * {
      margin: 0;
      padding: 0;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden
    }

    .webgl {
      position: fixed;
      top: 0;
      left: 0;
      outline: none;
    }

    a {
      color: rgb(0, 255, 229);
    }

    a:link {
      text-decoration: none;
    }

    a:visited {
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    a:active {
      text-decoration: underline;
    }
  </style>
</head>

<body>
  <canvas class="webgl"></canvas>

  <script type="importmap">
        {
          "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@v0.183.2/build/three.module.min.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@v0.183.2/examples/jsm/"
          }
        }
  </script>

  <script type="module" src="./simple.js"></script>
</body>

</html>
