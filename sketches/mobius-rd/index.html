
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Möbius transformations</title>
  <link rel="stylesheet" href="./style.css">

</head>

<body>
  <div class="menu">
    <div class="control">
        <label>Dilatation</label>
        <input type="range" id="dilatation" min="0.1" max="5.0" step="0.01" value="1.0">
    </div>
    <div class="control">
        <label>Rotation</label>
        <input type="range" id="rotation" min="0" max="6.28" step="0.01" value="0">
    </div>
    <div class="control">
        <label>Inversion (Flip)</label>
        <input type="range" id="inversion" min="0" max="3.14" step="0.01" value="0">
    </div>
</div>
<canvas class="webgl"></canvas>

  <footer class="footer">
    
  </footer>

                "three/tsl": "https://cdn.jsdelivr.net/npm/three@v0.183.2/build/three.tsl.js",
