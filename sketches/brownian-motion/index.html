<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brownian Motion with 80,000 Particles</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #fff;
        }

        canvas {
            display: block;
        }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.179.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.179.0/examples/jsm/"
            }
        }
    </script>
</head>

<body>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xffffff);
        scene.rotation.x = Math.PI / 4; // rotate entire scene

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        camera.position.z = 20;

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.minDistance = 10;
        controls.maxDistance = 100;

        // Particle setup
        const particleCount = 80000;
        const colors = [
            new THREE.Color(0xcc0000), // dark red
            new THREE.Color(0xff6600), // strong orange
            new THREE.Color(0xcccc00), // dark yellow
            new THREE.Color(0x009900), // dark green
            new THREE.Color(0x0000cc), // dark blue
            new THREE.Color(0x6600cc), // purple
            new THREE.Color(0xcc00cc), // magenta
            new THREE.Color(0x666666), // gray
            new THREE.Color(0x008080)  // teal
        ];
        const colorClasses = colors.length;
        const particlesPerColor = Math.floor(particleCount / colorClasses);

        const particles = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3);
        const colorArray = new Float32Array(particleCount * 3);

        for (let i = 0; i < particleCount; i++) {
            const radius = 20 * Math.cbrt(Math.random());
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);

            positions[i * 3] = radius * Math.sin(phi) * Math.cos(theta);
            positions[i * 3 + 1] = radius * Math.sin(phi) * Math.sin(theta);
            positions[i * 3 + 2] = radius * Math.cos(phi);

            const colorClass = Math.floor(i / particlesPerColor) % colorClasses;
            const color = colors[colorClass];
            colorArray[i * 3] = color.r;
            colorArray[i * 3 + 1] = color.g;
            colorArray[i * 3 + 2] = color.b;
        }

        particles.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        particles.setAttribute('color', new THREE.BufferAttribute(colorArray, 3));

        const textureLoader = new THREE.TextureLoader();
        const particleTexture = textureLoader.load('1.png');

        const particleMaterial = new THREE.PointsMaterial({
            size: 0.5,
            alphaMap: particleTexture,
            alphaTest: 0.5,
            vertexColors: true,
            transparent: false,
            opacity: 0.9,
            blending: THREE.NormalBlending
        });

        const particleSystem = new THREE.Points(particles, particleMaterial);
        scene.add(particleSystem);

        // Velocities
        const velocities = new Float32Array(particleCount * 3);
        for (let i = 0; i < particleCount * 3; i++) {
            velocities[i] = (Math.random() - 0.5) * 0.015;
        }

        // Attractor points
        const attractors = [
            new THREE.Vector3(30, 0, 0),
            new THREE.Vector3(-30, 0, 0),
            new THREE.Vector3(0, -30, 0)
        ];

        const startTime = performance.now();
        let clustering = false;
        let clusterStartTime = null;

        // Assign a small random 3D offset for each particle (outside animate)
        const offsets = new Float32Array(particleCount * 3);
        const strengths = new Float32Array(particleCount);
        for (let i = 0; i < particleCount; i++) {
            offsets[i * 3] = (Math.random() - 0.5) * 15; // random offset X
            offsets[i * 3 + 1] = (Math.random() - 0.5) * 15; // random offset Y
            offsets[i * 3 + 2] = (Math.random() - 0.5) * 15; // random offset Z
            strengths[i] = 0.0005 + Math.random() * 0.0007; // slightly different pull per particle
        }

        function animate() {
            requestAnimationFrame(animate);

            const now = performance.now();
            const elapsed = now - startTime;

            if (!clustering && elapsed > 30000) {
                clustering = true;
                clusterStartTime = now;
            }

            const pos = particles.attributes.position.array;

            for (let i = 0; i < particleCount; i++) {
                const idx = i * 3;

                // Brownian motion always active
                pos[idx] += velocities[idx] + (Math.random() - 0.5) * 0.01;
                pos[idx + 1] += velocities[idx + 1] + (Math.random() - 0.5) * 0.01;
                pos[idx + 2] += velocities[idx + 2] + (Math.random() - 0.5) * 0.01;

                if (clustering) {
                    const target = attractors[i % 3];

                    // Use particle's personal offset to avoid symmetry
                    const targetX = target.x + offsets[idx];
                    const targetY = target.y + offsets[idx + 1];
                    const targetZ = target.z + offsets[idx + 2];

                    let dx = targetX - pos[idx];
                    let dy = targetY - pos[idx + 1];
                    let dz = targetZ - pos[idx + 2];

                    const dist = Math.sqrt(dx * dx + dy * dy + dz * dz);

                    const desiredRadius = 10;

                    // Smooth transition for attraction strength (10-second ramp)
                    let t = Math.min((now - clusterStartTime) / 10000, 1);
                    const pullStrength = t * strengths[i]; // personal pull strength

                    if (dist > desiredRadius) {
                        // Keep the small noise inside the pull
                        dx += (Math.random() - 0.5) * 1.5;
                        dy += (Math.random() - 0.5) * 1.5;
                        dz += (Math.random() - 0.5) * 1.5;

                        pos[idx] += dx * pullStrength;
                        pos[idx + 1] += dy * pullStrength;
                        pos[idx + 2] += dz * pullStrength;
                    } else {
                        // Repel slightly if too close
                        const repelStrength = 0.0004;
                        pos[idx] -= dx * repelStrength;
                        pos[idx + 1] -= dy * repelStrength;
                        pos[idx + 2] -= dz * repelStrength;
                    }
                }
            }

            particles.attributes.position.needsUpdate = true;
            controls.update();
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>

</body>

</html>
