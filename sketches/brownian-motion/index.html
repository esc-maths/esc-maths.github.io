<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brownian Motion with 80,000 Textured Particles</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background-color: #fff;
        }
        canvas { 
            display: block; 
        }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.163.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.163.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // Scene setup
        const scene = new THREE.Scene();

        scene.background = new THREE.Color(0x000000); // background color

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Camera position
        camera.position.z = 0;

        // Add OrbitControls
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.screenSpacePanning = false;
        controls.minDistance = 20;
        controls.maxDistance = 100;

        // Particle system parameters
        const particleCount = 80000;
        const colors = [
            new THREE.Color(0xff0000), // red
            new THREE.Color(0xff7f00), // orange
            new THREE.Color(0xffff00), // yellow

            new THREE.Color(0x00ff00), // green
            new THREE.Color(0x0000ff), // blue
            new THREE.Color(0x4b0082), // indigo

            new THREE.Color(0x9400d3), // violet
            // new THREE.Color(0xffffff), // white
            // new THREE.Color(0x00ffff)  // cyan
        ];
        const colorClasses = colors.length;
        const particlesPerColor = Math.floor(particleCount / colorClasses);

        // Create particle geometry
        const particles = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3);
        const colorArray = new Float32Array(particleCount * 3);

        // Initialize particles with random positions and colors
        for (let i = 0; i < particleCount; i++) {
            // Random positions in a sphere
            const radius = 20 * Math.cbrt(Math.random());
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            
            positions[i * 3] = radius * Math.sin(phi) * Math.cos(theta);
            positions[i * 3 + 1] = radius * Math.sin(phi) * Math.sin(theta);
            positions[i * 3 + 2] = radius * Math.cos(phi);
            
            // Assign colors from the 9 classes
            const colorClass = Math.floor(i / particlesPerColor) % colorClasses;
            const color = colors[colorClass];
            colorArray[i * 3] = color.r;
            colorArray[i * 3 + 1] = color.g;
            colorArray[i * 3 + 2] = color.b;
        }

        // Add attributes to geometry
        particles.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        particles.setAttribute('color', new THREE.BufferAttribute(colorArray, 3));

        // Load particle texture
        const textureLoader = new THREE.TextureLoader();
        const particleTexture = textureLoader.load('1.png');
        
        // Create particle material with texture
        const particleMaterial = new THREE.PointsMaterial({
            size: 0.2,
            alphaMap: particleTexture,
            alphaTest: 0.5,
            vertexColors: false,
            transparent: false,
            opacity: 0.9,
            //depthWrite: false,
            vertexColors: true,
            //blending: THREE.AdditiveBlending
            blending: THREE.NormalBlending
        });

        // Create particle system
        const particleSystem = new THREE.Points(particles, particleMaterial);
        scene.add(particleSystem);

        // Brownian motion parameters
        const velocities = new Float32Array(particleCount * 3);
        for (let i = 0; i < particleCount * 3; i++) {
            velocities[i] = (Math.random() - 0.5) * 0.015;
        }

        // Animation loop
        function animate() {
            requestAnimationFrame(animate);
            
            // Update particle positions
            const positions = particles.attributes.position.array;
            
            for (let i = 0; i < particleCount; i++) {
                // Brownian motion - random walk
                positions[i * 3] += velocities[i * 3] + (Math.random() - 0.5) * 0.01;
                positions[i * 3 + 1] += velocities[i * 3 + 1] + (Math.random() - 0.5) * 0.01;
                positions[i * 3 + 2] += velocities[i * 3 + 2] + (Math.random() - 0.5) * 0.01;
                
                // Boundary conditions
                const maxDistance = 60;
                for (let j = 0; j < 3; j++) {
                    if (Math.abs(positions[i * 3 + j]) > maxDistance) {
                        positions[i * 3 + j] = maxDistance * Math.sign(positions[i * 3 + j]);
                        velocities[i * 3 + j] *= -0.5; // Bounce with some damping
                    }
                }
            }
            
            particles.attributes.position.needsUpdate = true;
            
            // Update controls
            controls.update();
            
            renderer.render(scene, camera);
        }

        // Handle window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Start animation
        animate();
    </script>
</body>
</html>
