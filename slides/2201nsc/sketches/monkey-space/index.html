<!DOCTYPE html>
<html lang="en">

<head>
	<title>Monkey space</title>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
	<link type="text/css" rel="stylesheet" href="style.css">
	<link rel="icon" type="image/png" href="../../images/icon/infinity32.png" sizes="32x32">
	<link rel="icon" type="image/png" href="../../images/icon/infinity16.png" sizes="16x16">

</head>

<body>

	<div id="container"></div>
	<div id="info">Monkey space -
		<a href="https://github.com/jcponce/jcponce.github.io/blob/master/math2001/sketches/monkey-space/index.html"
			target="_blank">💾</a> -
		<a href="https://threejs.org/examples/#webgl_instancing_dynamic" target="_blank" rel="noopener">three.js</a>
	</div>


	<script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.min.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
      }
    }
    </script>

	<script type="module">

		/*
			Forked from three.js Examples: Instancing / Dynamic
			https://threejs.org/examples/#webgl_instancing_dynamic
		*/

		import * as THREE from "three";
		import { OrbitControls } from "three/addons/controls/OrbitControls.js";
		import { GUI } from "three/addons/libs/lil-gui.module.min.js";

		let camera, scene, renderer;
		let controls;
		let mesh;

		const amount = parseInt(window.location.search.slice(1)) || 20;
		const count = Math.pow(amount, 3);
		const dummy = new THREE.Object3D();
		let rot = true;

		init();
		animate();

		function init() {
			camera = new THREE.PerspectiveCamera(
				60,
				window.innerWidth / window.innerHeight,
				0.1,
				200
			);
			const p = 1;
			camera.position.set(amount * p, amount * p, amount * p);
			camera.lookAt(0, 0, 0);

			scene = new THREE.Scene();

			// ✅ Add fog
			scene.background = new THREE.Color(0x000000);
			scene.fog = new THREE.FogExp2(0x000000, 0.03);
			// try: new THREE.Fog(0x000000, 10, 100);

			const light = new THREE.DirectionalLight(0xffffff, 1);
			light.position.set(1, 1, 1);
			scene.add(light);

			const ambient = new THREE.AmbientLight(0x404040, 0.5);
			scene.add(ambient);

			const loader = new THREE.BufferGeometryLoader();
			loader.load(
				"https://raw.githubusercontent.com/mrdoob/three.js/refs/heads/master/examples/models/json/suzanne_buffergeometry.json",
				function (geometry) {
					geometry.computeVertexNormals();
					geometry.scale(0.5, 0.5, 0.5);

					//const material = new THREE.MeshNormalMaterial();
					const material = new THREE.MeshStandardMaterial({
						color: 0x00ffff,
						roughness: 0.7,
						metalness: 0.7,
						fog: true   // enable fog explicitly
					});

					mesh = new THREE.InstancedMesh(geometry, material, count);
					mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
					scene.add(mesh);

					// GUI controls
					const contUI = { animate: true };
					const gui = new GUI();
					gui.add(mesh, "count", 0, count);
					gui.add(contUI, "animate").onChange(() => (rot = !rot));
					gui.close();
				}
			);

			renderer = new THREE.WebGLRenderer({ antialias: true });
			renderer.setPixelRatio(window.devicePixelRatio);
			renderer.setSize(window.innerWidth, window.innerHeight);
			document.body.appendChild(renderer.domElement);

			controls = new OrbitControls(camera, renderer.domElement);
			controls.autoRotate = true;
			controls.autoRotateSpeed = 0.2;
			controls.enableDamping = true;
			controls.enableZoom = false; // 🚫 disable zoom
			controls.enablePan = false; // 🚫 disable pan

			window.addEventListener("resize", onWindowResize);
		}

		function onWindowResize() {
			camera.aspect = window.innerWidth / window.innerHeight;
			camera.updateProjectionMatrix();
			renderer.setSize(window.innerWidth, window.innerHeight);
		}

		function animate() {
			requestAnimationFrame(animate);
			render();
		}

		function render() {
			if (mesh) {
				let time = rot ? Date.now() * 0.0002 : 0.0;

				let i = 0;
				const separation = 4;
				const offset = (amount - 1) / 2;

				for (let x = -amount / 2; x < amount / 2; x++) {
					for (let y = -amount / 2; y < amount / 2; y++) {
						for (let z = -amount / 2; z < amount / 2; z++) {
							dummy.position.set(
								offset - separation * x,
								offset - separation * y,
								offset - separation * z
							);
							dummy.rotation.y =
								Math.sin(x / 4 + time) +
								Math.sin(y / 4 + time) +
								Math.sin(z / 4 + time);
							dummy.rotation.z = dummy.rotation.y * 2;

							dummy.updateMatrix();
							mesh.setMatrixAt(i++, dummy.matrix);
						}
					}
				}

				mesh.instanceMatrix.needsUpdate = true;
			}

			controls.update();
			renderer.render(scene, camera);
		}

	</script>

</body>

</html>
