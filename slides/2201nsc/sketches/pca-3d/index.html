<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D PCA Asymmetrical Visualization</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #10141a;
            color: #ffffff;
            font-family: system-ui, -apple-system, sans-serif;
        }
        #info {
            position: absolute;
            top: 15px;
            width: 100%;
            text-align: center;
            pointer-events: none;
            z-index: 100;
        }
        .badge {
            display: inline-block;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(8px);
            padding: 10px 20px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
    </style>
    <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.185.1/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.185.1/examples/jsm/"
      }
    }
    </script>
</head>
<body>
    <div id="info">
        <div class="badge">
            <h3 style="margin: 0 0 4px 0;">3D PCA: Asymmetric Data Distribution</h3>
            <p style="margin: 0; font-size: 0.85em; opacity: 0.8;">Spherical points | Left Click: Rotate | Right Click: Pan | Scroll: Zoom</p>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --- 1. Scene & Renderer Setup ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0e1117);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(35, 25, 45);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // --- 2. Create Circular Particle Texture ---
        function createCircleTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 64;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');
            
            // Soft glowing radial gradient for rounded spherical dots
            const gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
            gradient.addColorStop(0, 'rgba(255, 255, 255, 1)');
            gradient.addColorStop(0.4, 'rgba(120, 220, 255, 0.9)');
            gradient.addColorStop(1, 'rgba(0, 80, 180, 0)');

            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(32, 32, 30, 0, Math.PI * 2);
            ctx.fill();

            const texture = new THREE.CanvasTexture(canvas);
            texture.needsUpdate = true;
            return texture;
        }

        // --- 3. Generate Asymmetric 3D Dataset ---
        const numPoints = 900;
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(numPoints * 3);
        const pointsArray = [];

        // Random rotation matrix to orient the cloud arbitrarily in 3D space
        const rotationEuler = new THREE.Euler(Math.PI / 5, -Math.PI / 4, Math.PI / 6);

        for (let i = 0; i < numPoints; i++) {
            // Asymmetrical skewed distribution using power scaling & non-linear curve
            const u = Math.random();
            let x = (Math.pow(u, 2.2) * 55 - 18); // Skewed density towards one end
            let y = Math.sin(x * 0.08) * 8 + (Math.random() - 0.5) * (10 + x * 0.2); // Curved, asymmetric spread
            let z = (Math.random() - 0.5) * (4 + Math.abs(x) * 0.25); // Asymmetric tapering

            // Occasional tail scatter/outliers
            if (Math.random() > 0.93) {
                x += (Math.random() - 0.5) * 18;
                y += (Math.random() - 0.5) * 18;
            }

            let vec = new THREE.Vector3(x, y, z);
            vec.applyEuler(rotationEuler); // Rotate dataset into arbitrary 3D orientation

            positions[i * 3] = vec.x;
            positions[i * 3 + 1] = vec.y;
            positions[i * 3 + 2] = vec.z;
            pointsArray.push(vec);
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

        const particleMaterial = new THREE.PointsMaterial({
            size: 1.5,
            map: createCircleTexture(),
            transparent: true,
            depthWrite: false,
            blending: THREE.AdditiveBlending,
            color: 0x66ccff
        });

        const pointCloud = new THREE.Points(geometry, particleMaterial);
        scene.add(pointCloud);

        // --- 4. PCA Calculations ---

        // A. Calculate Mean (Center of mass)
        let mean = new THREE.Vector3(0, 0, 0);
        pointsArray.forEach(p => mean.add(p));
        mean.divideScalar(numPoints);

        // B. Covariance Matrix (3x3)
        let C = [[0, 0, 0], [0, 0, 0], [0, 0, 0]];
        pointsArray.forEach(p => {
            let dx = p.x - mean.x;
            let dy = p.y - mean.y;
            let dz = p.z - mean.z;

            C[0][0] += dx * dx; C[0][1] += dx * dy; C[0][2] += dx * dz;
            C[1][0] += dy * dx; C[1][1] += dy * dy; C[1][2] += dy * dz;
            C[2][0] += dz * dx; C[2][1] += dz * dy; C[2][2] += dz * dz;
        });

        for (let i = 0; i < 3; i++) {
            for (let j = 0; j < 3; j++) {
                C[i][j] /= (numPoints - 1);
            }
        }

        // C. Power Iteration to solve Eigenvectors/Eigenvalues
        function getDominantEigen(matrix, iterations = 60) {
            let v = new THREE.Vector3(1, 1, 1).normalize();
            for (let i = 0; i < iterations; i++) {
                let next = new THREE.Vector3(
                    matrix[0][0] * v.x + matrix[0][1] * v.y + matrix[0][2] * v.z,
                    matrix[1][0] * v.x + matrix[1][1] * v.y + matrix[1][2] * v.z,
                    matrix[2][0] * v.x + matrix[2][1] * v.y + matrix[2][2] * v.z
                );
                v.copy(next).normalize();
            }
            let Mv = new THREE.Vector3(
                matrix[0][0] * v.x + matrix[0][1] * v.y + matrix[0][2] * v.z,
                matrix[1][0] * v.x + matrix[1][1] * v.y + matrix[1][2] * v.z,
                matrix[2][0] * v.x + matrix[2][1] * v.y + matrix[2][2] * v.z
            );
            return { vector: v, value: v.dot(Mv) };
        }

        function deflate(matrix, eigenVec, eigenVal) {
            let newM = [[0,0,0],[0,0,0],[0,0,0]];
            let vArr = [eigenVec.x, eigenVec.y, eigenVec.z];
            for (let i = 0; i < 3; i++) {
                for (let j = 0; j < 3; j++) {
                    newM[i][j] = matrix[i][j] - eigenVal * vArr[i] * vArr[j];
                }
            }
            return newM;
        }

        // D. Compute PC1, PC2, PC3
        let pc1 = getDominantEigen(C);
        let deflatedC1 = deflate(C, pc1.vector, pc1.value);
        let pc2 = getDominantEigen(deflatedC1);
        let pc3Vector = new THREE.Vector3().crossVectors(pc1.vector, pc2.vector).normalize();
        let deflatedC2 = deflate(deflatedC1, pc2.vector, pc2.value);
        let pc3Value = Math.max(0.1, deflatedC2[0][0] + deflatedC2[1][1] + deflatedC2[2][2]);
        let pc3 = { vector: pc3Vector, value: pc3Value };

        // --- 5. Render Components & Origin ---
        function addArrow(dir, origin, length, hex) {
            const visualScale = Math.sqrt(Math.max(0.1, length)) * 1.6;
            const arrowHelper = new THREE.ArrowHelper(dir, origin, visualScale, hex, 1.8, 1.0);
            const oppDir = dir.clone().negate();
            const arrowHelperOpp = new THREE.ArrowHelper(oppDir, origin, visualScale, hex, 0.001, 0.001);

            scene.add(arrowHelper);
            scene.add(arrowHelperOpp);
        }

        // Center Mean Sphere
        const originGeo = new THREE.SphereGeometry(0.7, 32, 32);
        const originMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
        const originMesh = new THREE.Mesh(originGeo, originMat);
        originMesh.position.copy(mean);
        scene.add(originMesh);

        // Add PC Eigenvector Arrows
        addArrow(pc1.vector, mean, pc1.value, 0xff4444); // Red: PC1 (Primary spread)
        addArrow(pc2.vector, mean, pc2.value, 0x44ff77); // Green: PC2 (Secondary spread)
        addArrow(pc3.vector, mean, pc3.value, 0x4499ff); // Blue: PC3 (Tertiary spread)

        // Subtle background grid
        const gridHelper = new THREE.GridHelper(80, 16, 0x2a3545, 0x18202c);
        gridHelper.position.y = -22;
        scene.add(gridHelper);

        // --- 6. Render Loop ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
