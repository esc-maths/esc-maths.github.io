<!DOCTYPE html>
<html lang="en">

<head>
    <title>three.js webgl - modifier - simplify modifier</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <meta property="og:title" content="three.js webgl - modifier - simplify modifier">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://threejs.org/examples/webgl_modifier_simplifier.html">
    <meta property="og:image" content="https://threejs.org/examples/screenshots/webgl_modifier_simplifier.jpg">
    <link type="text/css" rel="stylesheet" href="main.css">
</head>

<body>
    <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.185.1/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.185.1/examples/jsm/"
      }
    }
    </script>

    <script type="module">

        import * as THREE from 'three';

        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { SimplifyModifier } from 'three/addons/modifiers/SimplifyModifier.js';

        // Fixed: Added controls to the global scope so the animate loop can access it
        let renderer, scene, camera, controls;

        init();

        function init() {

            const info = document.createElement('div');
            info.style.position = 'absolute';
            info.style.top = '10px';
            info.style.width = '100%';
            info.style.textAlign = 'center';
            info.innerHTML = '<a href="https://threejs.org" target="_blank" rel="noopener">three.js</a> - Vertex Reduction';
            document.body.appendChild(info);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            scene = new THREE.Scene();

            camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 1, 1000);
            camera.position.z = 15;

            // Assigned to the global variable and added auto-rotation properties
            controls = new OrbitControls(camera, renderer.domElement);
            controls.autoRotate = false;
            //controls.autoRotateSpeed = 0.5;
            controls.enablePan = false;
            controls.enableZoom = false;

            scene.add(new THREE.AmbientLight(0xffffff, 0.6));

            const light = new THREE.PointLight(0xffffff, 400);
            camera.add(light);
            scene.add(camera);

            new GLTFLoader().load('LeePerrySmith.glb', function (gltf) {

                const mesh = gltf.scene.children[0];

                const normalMaterial = new THREE.MeshNormalMaterial();
                mesh.material = normalMaterial;

                mesh.position.x = - 3;
                mesh.rotation.y = Math.PI / 2;
                scene.add(mesh);

                const modifier = new SimplifyModifier();

                const simplified = mesh.clone();
                simplified.material = normalMaterial.clone();
                simplified.material.flatShading = true;

                const count = Math.floor(simplified.geometry.attributes.position.count * 0.91);
                simplified.geometry = modifier.modify(simplified.geometry, count);

                simplified.position.x = 3;
                simplified.rotation.y = - Math.PI / 2;
                scene.add(simplified);

                // Swapped out manual render() for the animation loop initiation
                animate();

            });

            window.addEventListener('resize', onWindowResize);

        }

        function onWindowResize() {

            renderer.setSize(window.innerWidth, window.innerHeight);

            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();

        }

        // Added continuous animation loop
        function animate() {

            requestAnimationFrame(animate);

            // Required to calculate the next step of auto-rotation
            controls.update();

            renderer.render(scene, camera);

        }

    </script>

</body>

</html>
