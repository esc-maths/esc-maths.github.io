<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Three.js Geometry Resolution Demo</title>

    <style>
        html,
        body {
            margin: 0;
            overflow: hidden;
            background: #111;
            font-family: Arial, Helvetica, sans-serif;
        }

        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 10px;
            width: 280px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            z-index: 10;
        }

        label {
            display: block;
            margin-bottom: 10px;
            font-weight: bold;
            color: #333;
        }

        .count-display {
            font-size: 1.2em;
            color: #0066cc;
        }

        input[type="range"] {
            width: 100%;
            margin-top: 5px;
        }
        
        .hint {
            font-size: 0.85em;
            color: #666;
            margin-top: 8px;
            font-weight: normal;
            font-style: italic;
        }
    </style>

    <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.185.1/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.185.1/examples/jsm/"
      }
    }
    </script>
</head>

<body>

    <div id="ui">
        <label>
            Geometry Resolution Slider
            <input id="slider" type="range" min="3" max="150" value="60">
        </label>
        <label>
            Total Vertices: <span id="vertexCount" class="count-display">0</span>
        </label>
        <label>
            Total Triangles: <span id="faceCount" class="count-display">0</span>
        </label>
        <div class="hint">Slide left for low poly, slide right for high poly. Drag to rotate the knot!</div>
    </div>

    <script type="module">

        import * as THREE from "three";
        import { OrbitControls } from "three/addons/controls/OrbitControls.js";

        // --- 1. Scene Setup ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a1a);

        const camera = new THREE.PerspectiveCamera(
            45,
            window.innerWidth / window.innerHeight,
            0.1,
            100
        );
        camera.position.set(0, 0, 20);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // --- 2. Lighting (Crucial for visualizing solid faces) ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);

        const dirLight1 = new THREE.DirectionalLight(0xffffff, 1.5);
        dirLight1.position.set(10, 10, 10);
        scene.add(dirLight1);

        const dirLight2 = new THREE.DirectionalLight(0x0088ff, 1.0); // Subtle blue rim light
        dirLight2.position.set(-10, -10, -10);
        scene.add(dirLight2);

        // --- 3. Mesh Setup ---
        // Flat shading makes individual polygons highly visible at lower resolutions
        const material = new THREE.MeshStandardMaterial({
            color: 0x00b4d8,
            roughness: 0.3,
            metalness: 0.2,
            flatShading: true, 
            side: THREE.DoubleSide
        });

        let knotMesh = new THREE.Mesh(new THREE.BufferGeometry(), material);
        scene.add(knotMesh);

        // --- 4. UI Elements ---
        const slider = document.getElementById("slider");
        const vertexCountLabel = document.getElementById("vertexCount");
        const faceCountLabel = document.getElementById("faceCount");

        // --- 5. Dynamic Geometry Generation Function ---
        function rebuildKnot(resolution) {
            // Dispose of old geometry to prevent memory leaks
            knotMesh.geometry.dispose();

            // TorusKnot parameters: radius, tubeRadius, tubularSegments, radialSegments
            // We tie tubularSegments directly to our slider resolution value
            const tubularSegments = resolution;
            const radialSegments = Math.max(3, Math.floor(resolution / 4)); 

            const newGeometry = new THREE.TorusKnotGeometry(3, 0.8, tubularSegments, radialSegments);
            
            // Assign the new geometric structure to our mesh
            knotMesh.geometry = newGeometry;

            // Update UI Counters
            const vertexCount = newGeometry.attributes.position.count;
            const triangleCount = newGeometry.index ? newGeometry.index.count / 3 : vertexCount / 3;

            vertexCountLabel.textContent = vertexCount.toLocaleString();
            faceCountLabel.textContent = triangleCount.toLocaleString();
        }

        // --- 6. Event Interaction ---
        slider.oninput = () => {
            rebuildKnot(Number(slider.value));
        };

        // Initialize with default slider value
        rebuildKnot(Number(slider.value));

        // --- 7. Animation Loop & Resizing ---
        window.addEventListener("resize", () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        renderer.setAnimationLoop(() => {
            controls.update();
            
            // Slow automatic rotation so students can observe the changing facets
            knotMesh.rotation.y += 0.002;
            knotMesh.rotation.x += 0.002;

            renderer.render(scene, camera);
        });

    </script>

</body>

</html>
