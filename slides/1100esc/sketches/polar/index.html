<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <title>MathBox - Polar coordinates</title>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/three@0.137.0/build/three.min.js"></script>
    <script type="text/javascript"
        src="https://cdn.jsdelivr.net/npm/three@0.137.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://www.dynamicmath.xyz/math2001/sketches/mathbox/dat.gui.min.js"></script>
    <!--
      - a minified version mathbox.min.js is also available;
      - recommend using a specific version (not @latest) in public sites
    -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/mathbox@latest/build/bundle/mathbox.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/mathbox@latest/build/mathbox.css" />

    <link rel="stylesheet" href="dat-gui-light-theme.css">
    <meta name="viewport" content="initial-scale=1, maximum-scale=1" />

</head>

<body>
    <script type="application/glsl" id="vertex-warp">
      uniform float time;
      uniform float intensity;

      vec4 warpVertex(vec4 xyzw, inout vec4 stpq) {
        xyzw +=   0.2 * intensity * (sin(xyzw.yzwx * 1.91 + time + sin(xyzw.wxyz * 1.74 + time)));
        xyzw +=   0.1 * intensity * (sin(xyzw.yzwx * 4.03 + time + sin(xyzw.wxyz * 2.74 + time)));
        xyzw +=  0.05 * intensity * (sin(xyzw.yzwx * 8.39 + time + sin(xyzw.wxyz * 4.18 + time)));
        xyzw += 0.025 * intensity * (sin(xyzw.yzwx * 15.1 + time + sin(xyzw.wxyz * 9.18 + time)));

        return xyzw;
      }
    </script>
    <script>
        var mathbox = MathBox.mathBox({
            plugins: ["core", "controls", "cursor"],
            controls: {
                klass: THREE.OrbitControls,
            },
        });
        var three = mathbox.three;

        three.camera.position.set(0, 0, 3);
        three.renderer.setClearColor(new THREE.Color(0xffffff), 1.0);

        function pingpong(t) {
            return -Math.cos(t / 4);
        }

        formatNumber = MathBox.Util.Pretty.number();

        mathbox.set({
            scale: 600,
            focus: 3,
        });

        var warpShader = mathbox.shader(
            {
                code: "#vertex-warp",
            },
            {
                time: function (t) {
                    return t / 4;
                },
                intensity: function (t) {
                    t = t / 4;
                    intensity = 0.5 + 0.5 * Math.cos(t / 3);
                    intensity = 1.0 - Math.pow(intensity, 4);
                    return intensity;
                },
            }
        );

        var transition = mathbox.reveal(

            {
                enter: function (t) {
                    return 1.0 - Math.pow(1.0 - Math.min(1, (1 + pingpong(t)) * 2), 2);
                },
                exit: function (t) {
                    return 1.0 - Math.pow(1.0 - Math.min(1, (1 - pingpong(t)) * 2), 2);
                },
            }
        );

        var view = transition
            .vertex({
                pass: "view",
            })
            .polar({
                bend: 0,
                range: [
                    [-MathBox.π, MathBox.π],
                    [0, 1],
                    [-1, 1],
                ],
                scale: [2, 1, 1],
            });

        view
            .transform({
                position: [0, 0.5, 0],
            })
            .axis({
                detail: 512,
            })
            .scale({
                divide: 10,
                unit: MathBox.π,
                base: 2,
            })
            .ticks({
                width: 2,
                classes: ["foo", "bar"],
            })
            .scale({
                divide: 5,
                unit: MathBox.π,
                base: 2,
            })
            .format({
                expr: function (x) {
                    return formatNumber(x);
                },
            })
            .label({
                depth: 0.5,
                zIndex: 1,
            });

        view.axis({
            axis: 2,
            detail: 128,
            crossed: true,
        });
        // view
        //     .transform({
        //         position: [MathBox.π / 2, 0, 0],
        //     })
        //     .axis({
        //         axis: 2,
        //         detail: 128,
        //         crossed: true,
        //     });
        // view
        //     .transform({
        //         position: [-MathBox.π / 2, 0, 0],
        //     })
        //     .axis({
        //         axis: 2,
        //         detail: 128,
        //         crossed: true,
        //     });

        let alpha = { value: 0 }; // blending control
        view
            .interval({
                id: "sampler",
                width: 512,
                expr: function (emit, x, i, t) {
                    var f1 =
                        0.5 +
                        0.6 * Math.sin(x + t) +
                        0.3 * Math.sin(x * 2 + t * 1.81) +
                        0.1825 * Math.sin(x * 3 + t * 2.18);

                    var f2 = 0.3 * Math.sin(x + t) + 0.5;

                    var y = (1 - alpha.value) * f2 + alpha.value * f1;

                    emit(x, y);
                },
                channels: 2,
            })
            .grid({
                divideX: 40,
                detailX: 512,
                divideY: 20,
                detailY: 128,
                width: 1,
                opacity: 0.5,
                unitX: MathBox.π,
                baseX: 2,
                zBias: -5,
            })
            .line({
                points: "#sampler",
                color: 0x3366ff,
                width: 5,
            });

        // Transition speed (ms)
        const transitionDuration = 2000; // 2 seconds for morph
        const holdDuration = 7000;       // 5 seconds hold

        function transition(toValue, onComplete) {
            const startValue = alpha.value;
            const delta = toValue - startValue;
            const startTime = performance.now();

            function step(now) {
                let t = (now - startTime) / transitionDuration;
                if (t >= 1) {
                    alpha.value = toValue;
                    if (onComplete) onComplete();
                } else {
                    // Smooth easing (sinusoidal in/out)
                    let eased = 0.5 - 0.5 * Math.cos(Math.PI * t);
                    alpha.value = startValue + delta * eased;
                    requestAnimationFrame(step);
                }
            }

            requestAnimationFrame(step);
        }

        function cycle() {
            // 1. Hold f1
            setTimeout(() => {
                // 2. Transition to f2
                transition(1, () => {
                    // 3. Hold f2
                    setTimeout(() => {
                        // 4. Transition back to f1
                        transition(0, cycle);
                    }, holdDuration);
                });
            }, holdDuration);
        }

        // Kick off the cycle
        cycle();
    </script>
</body>

</html>
