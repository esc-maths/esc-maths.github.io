<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Scientific notation practice</title>
    <style>
        :root {
            --ink: #111111;
            --muted: #5A5A5A;
            --bg: #F1F1F1;
            --card: #fff;
            --line: #D4D4D4;
            --accent: #111111;
            --accent-d: #3A3A3A;
            --accent-t: #EEEEEE;
            --focus: rgba(17, 17, 17, .28);
            --ok: #1F7A4D;
            --ok-bg: #E4F4EB;
            --bad: #E51F30;
            --bad-d: #B8101F;
            --bad-bg: #FDECEE;
            --num: Georgia, "Times New Roman", serif;
        }

        * {
            box-sizing: border-box
        }

        html,
        body {
            height: 100%;
            margin: 0
        }

        body {
            background: var(--bg);
            color: var(--ink);
            font: 17px/1.4 "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
        }

        #app {
            max-width: 700px;
            height: 100%;
            margin: 0 auto;
            padding: 8px 14px;
            display: flex;
            flex-direction: column;
            gap: 6px
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            flex: none
        }

        .dots {
            display: flex;
            gap: 5px
        }

        .dot {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border: 2px solid var(--line);
            background: #fff;
            color: #fff;
            font-size: 11px;
            line-height: 16px;
            text-align: center
        }

        .dot.cur {
            border-color: var(--accent)
        }

        .dot.ok {
            background: var(--ok);
            border-color: var(--ok)
        }

        .dot.miss {
            background: var(--bad);
            border-color: var(--bad)
        }

        .status {
            font-size: 14px;
            color: var(--muted);
            text-align: right
        }

        #card {
            flex: 1;
            min-height: 0;
            overflow: auto;
            background: var(--card);
            border: 1px solid var(--line);
            border-top: 4px solid var(--accent);
            border-radius: 12px;
            padding: 8px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            text-align: center
        }

        .prompt {
            margin: 0;
            color: var(--muted)
        }

        .big {
            font: 400 clamp(30px, 8.5vw, 50px)/1.1 var(--num);
            word-break: break-all
        }

        sup {
            font-size: .55em;
            line-height: 0
        }

        .ans {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            flex-wrap: wrap;
            padding-top: 12px
        }

        .times {
            font: 28px var(--num)
        }

        input {
            font: 400 28px var(--num);
            color: var(--ink);
            background: #fff;
            border: 2px solid var(--line);
            border-radius: 8px;
            padding: 4px 8px;
            text-align: center;
            outline: none
        }

        input:focus-visible {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--focus)
        }

        #coef {
            width: 126px
        }

        #exp {
            width: 72px;
            font-size: 21px;
            padding: 3px 6px;
            position: relative;
            top: -14px
        }

        #std {
            width: min(100%, 320px)
        }

        input.wrong {
            border-color: var(--bad);
            background: var(--bad-bg)
        }

        input.right {
            border-color: var(--ok);
            background: var(--ok-bg)
        }

        .opts {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            width: 100%;
            max-width: 480px
        }

        .opt {
            font: 400 25px var(--num);
            color: var(--ink);
            background: #fff;
            border: 2px solid var(--line);
            border-radius: 8px;
            padding: 5px 6px;
            cursor: pointer
        }

        .opt:hover:not(:disabled) {
            border-color: var(--accent)
        }

        .opt:focus-visible {
            outline: 3px solid var(--focus);
            outline-offset: 1px
        }

        .opt[aria-checked=true] {
            border-color: var(--accent);
            background: var(--accent-t)
        }

        .opt.wrong {
            border-color: var(--bad);
            background: var(--bad-bg)
        }

        .opt.right {
            border-color: var(--ok);
            background: var(--ok-bg)
        }

        .opt:disabled {
            cursor: default
        }

        .final {
            font: 400 clamp(48px, 13vw, 68px)/1 var(--num);
            color: var(--accent)
        }

        .final small {
            font-size: .45em;
            color: var(--muted)
        }

        .fb {
            flex: none;
            min-height: 70px;
            border-radius: 8px;
            padding: 7px 12px;
            font-size: 15.5px;
            line-height: 1.35;
            border-left: 4px solid transparent
        }

        .fb.tip {
            color: var(--muted)
        }

        .fb.gone {
            display: none
        }

        .fb.note {
            background: #E6E6E6;
            border-color: var(--muted)
        }

        .fb.ok {
            background: var(--ok-bg);
            border-color: var(--ok)
        }

        .fb.bad {
            background: var(--bad-bg);
            border-color: var(--bad)
        }

        .fb.ok b {
            color: var(--ok)
        }

        .fb.bad b {
            color: var(--bad-d)
        }

        .fb.bad .hint b {
            color: var(--ink)
        }

        .hint {
            margin-top: 5px;
            padding: 4px 8px;
            background: var(--accent-t);
            border-left: 3px solid var(--accent);
            border-radius: 4px
        }

        #card.done {
            justify-content: flex-start
        }

        .sum {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            text-align: left
        }

        .sum .final {
            font-size: 44px
        }

        .sum .prompt {
            max-width: 380px;
            font-size: 16px
        }

        .review {
            width: 100%;
            text-align: left;
            font-size: 15.5px
        }

        .review b {
            display: block;
            margin-bottom: 2px
        }

        .review ul {
            margin: 0;
            padding: 0;
            list-style: none
        }

        .review li {
            padding: 4px 0;
            border-top: 1px solid var(--line)
        }

        .eq {
            font: 400 19px var(--num);
            margin-right: 8px;
            white-space: nowrap
        }

        .rtip {
            color: var(--muted)
        }

        footer {
            flex: none;
            display: flex;
            justify-content: center
        }

        .btn {
            min-width: 210px;
            font-family: inherit;
            font-weight: 600;
            font-size: 17px;
            color: #fff;
            background: var(--accent);
            border: 0;
            border-radius: 8px;
            padding: 9px 22px;
            cursor: pointer
        }

        .btn:hover:not(:disabled) {
            background: var(--accent-d)
        }

        .btn:focus-visible {
            outline: 3px solid var(--focus);
            outline-offset: 2px
        }

        .btn:disabled {
            background: #B5B5B5;
            cursor: not-allowed
        }
    </style>
</head>

<body>
    <main id="app">
        <header>
            <div class="dots" id="dots" aria-hidden="true"></div>
            <div class="status" id="status"></div>
        </header>
        <section id="card"></section>
        <div class="fb" id="fb" role="status" aria-live="polite"></div>
        <footer><button class="btn" id="primary" type="button">Check answer</button></footer>
    </main>

    <script>
        // Immediately Invoked Function Expression (IIFE)
        (() => {
            // ==========================================
            // 1. CONFIGURATION & UTILITY HELPERS
            // ==========================================
            const TOTAL = 5; // Number of questions per quiz set
            const $ = (id) => document.getElementById(id); // Short alias for getElementById
            const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1)); // Random integer between a and b

            // Fisher-Yates shuffle algorithm to randomize arrays (options, question types)
            const shuffle = (a) => {
                for (let k = a.length - 1; k > 0; k--) {
                    const j = rnd(0, k);
                    [a[k], a[j]] = [a[j], a[k]];
                }
                return a;
            };

            const MINUS = '\u2212';
            const sg = (e) => (e < 0 ? MINUS + -e : String(e)); // Format negative/positive signs cleanly
            const sci = (c, e) => `${c} \u00D7 10<sup>${sg(e)}</sup>`; // Format scientific notation HTML
            const plural = (n) => `${n} place${n === 1 ? '' : 's'}`; // Pluralize word "places"

            // ==========================================
            // 2. DECIMAL SHIFTING & FORMATTING
            // ==========================================
            /* Move the decimal point k places (k>0 right, k<0 left) in a plain digit string. */
            const shift = (str, k) => {
                const [ip, fp = ''] = str.split('.');
                let digits = ip + fp;
                let p = ip.length + k;
                if (p <= 0) {
                    digits = '0'.repeat(-p) + digits;
                    p = 0;
                } else if (p > digits.length) {
                    digits += '0'.repeat(p - digits.length);
                }
                let a = digits.slice(0, p).replace(/^0+(?=\d)/, '');
                const b = digits.slice(p).replace(/0+$/, '');
                if (a === '') a = '0';
                return b ? `${a}.${b}` : a;
            };

            // Add commas to large numbers for readability in standard form
            const fmt = (s) => {
                const [ip, fp] = s.split('.');
                const a = ip.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
                return fp ? `${a}.${fp}` : a;
            };

            // ==========================================
            // 3. QUESTION GENERATION LOGIC
            // ==========================================
            // Generate a random coefficient between 1 and 10 (with 1 to 3 significant figures)
            const makeCoef = () => {
                const sig = rnd(1, 3);
                let d = `${rnd(1, 9)}`;
                for (let k = 1; k < sig; k++) d += k === sig - 1 ? rnd(1, 9) : rnd(0, 9);
                return sig > 1 ? `${d[0]}.${d.slice(1)}` : d;
            };

            // Generate incorrect options for multiple-choice questions with educational explanations
            const makeOpts = (p) => {
                const up = shift(p.coef, 1);
                const down = shift(p.coef, -1);
                return shuffle([
                    { c: p.coef, e: p.e, ok: true },
                    { c: up, e: p.e - 1, why: `${up} is not between 1 and 10, so this is not proper scientific notation, even though the value matches.` },
                    { c: down, e: p.e + 1, why: `${down} is less than 1, so this is not proper scientific notation, even though the value matches.` },
                    { c: p.coef, e: -p.e, why: p.e > 0 ? 'The digits are right, but a large number needs a positive exponent.' : 'The digits are right, but a number smaller than 1 needs a negative exponent.' },
                ]);
            };

            // Generate a complete balanced set of questions (mix of scientific, standard, and multiple choice)
            const newSet = () => {
                const nSci = Math.ceil(TOTAL * 0.4);
                const nStd = Math.round(TOTAL * 0.3);
                const nMc = TOTAL - nSci - nStd;
                const types = [];
                for (let k = 0; k < nSci; k++) types.push('sci');
                for (let k = 0; k < nStd; k++) types.push('std');
                for (let k = 0; k < nMc; k++) types.push('mc');
                shuffle(types);

                const seen = new Set();
                return types.map((type) => {
                    let p;
                    do {
                        p = { type, coef: makeCoef(), e: (Math.random() < 0.5 ? -1 : 1) * rnd(2, 8) };
                    } while (seen.has(`${p.coef}|${p.e}`));
                    seen.add(`${p.coef}|${p.e}`);
                    p.std = shift(p.coef, p.e);
                    if (type === 'mc') p.opts = makeOpts(p);
                    return p;
                });
            };

            // ==========================================
            // 4. STATE VARIABLES & DOM REFERENCES
            // ==========================================
            let set, i, tries, phase, picked, status;
            let interacted = false;
            const primary = $('primary'); // Main action button ("Check answer", "Next question", etc.)
            const card = $('card');       // Main content card container
            const score = () => status.filter((s) => s === 'ok').length; // Calculate current correct answers

            // Display feedback messages and hints to the user
            const fb = (kind, msg, hint) => {
                const el = $('fb');
                el.className = `fb${kind ? ` ${kind}` : ''}`;
                el.innerHTML = msg
                    ? `<div>${msg}</div>${hint ? `<div class="hint"><b>Hint:</b> ${hint}</div>` : ''}`
                    : '';
            };

            // Update progress dots and score status text in the header
            const head = () => {
                let h = '';
                for (let k = 0; k < TOTAL; k++) {
                    const s = status[k];
                    const cls = s === 'ok' ? 'ok' : s === 'miss' ? 'miss' : k === i && phase !== 'done' ? 'cur' : '';
                    h += `<span class="dot ${cls}">${s === 'ok' ? '\u2713' : s === 'miss' ? '\u2715' : ''}</span>`;
                }
                $('dots').innerHTML = h;
                $('status').textContent =
                    phase === 'done' ? 'Set complete' : `Question ${i + 1} of ${TOTAL} \u00B7 ${score()} correct`;
            };

            // Start a fresh quiz set
            const startSet = () => {
                set = newSet();
                i = 0;
                status = [];
                showQ();
            };

            // ==========================================
            // 5. UI RENDERING (QUESTIONS & OPTIONS)
            // ==========================================
            // Render the current question onto the card based on its type
            const showQ = () => {
                phase = 'ask';
                tries = 0;
                picked = null;
                const p = set[i];
                let h = '';

                if (p.type === 'sci') {
                    h = `<p class="prompt">Write this number in scientific notation.</p>` +
                        `<div class="big">${fmt(p.std)}</div>` +
                        `<div class="ans"><input id="coef" inputmode="decimal" autocomplete="off" aria-label="Number from 1 to just under 10"><span class="times">\u00D7 10</span><input id="exp" inputmode="text" autocomplete="off" aria-label="Exponent of 10"></div>`;
                } else if (p.type === 'std') {
                    h = `<p class="prompt">Write this number in standard form.</p>` +
                        `<div class="big">${sci(p.coef, p.e)}</div>` +
                        `<div class="ans"><input id="std" inputmode="decimal" autocomplete="off" aria-label="Standard form"></div>`;
                } else {
                    h = `<p class="prompt">Which choice is this number in proper scientific notation?</p>` +
                        `<div class="big">${fmt(p.std)}</div>` +
                        `<div class="opts" role="radiogroup">${p.opts
                            .map((o, k) => `<button type="button" class="opt" role="radio" aria-checked="false" data-i="${k}">${sci(o.c, o.e)}</button>`)
                            .join('')}</div>`;
                }

                card.className = '';
                card.innerHTML = h;
                primary.textContent = 'Check answer';
                primary.disabled = p.type === 'mc';
                fb('tip', 'Scientific notation is a number from 1 up to (but not including) 10, times a power of 10.');
                head();

                // Clear error styles on user typing and auto-focus input fields
                const f = $('coef') || $('std');
                if (f) {
                    const x = $('exp');
                    f.addEventListener('input', () => {
                        f.classList.remove('wrong');
                        if (x) x.classList.remove('wrong');
                    });
                    if (x) {
                        x.addEventListener('input', () => {
                            x.classList.remove('wrong');
                            f.classList.remove('wrong');
                        });
                    }
                    if (interacted) f.focus();
                }
            };

            // Handle multiple-choice option selection
            card.addEventListener('click', (e) => {
                const b = e.target.closest('.opt');
                if (!b || phase !== 'ask' || b.disabled) return;
                picked = +b.getAttribute('data-i');
                card.querySelectorAll('.opt').forEach((o) => o.setAttribute('aria-checked', o === b ? 'true' : 'false'));
                primary.disabled = false;
            });

            // ==========================================
            // 6. ANSWER VALIDATION & CHECKING LOGIC
            // ==========================================
            // Validate user input for "Scientific Notation" questions
            const checkSci = (p) => {
                const cs = $('coef').value.replace(/\s/g, '');
                const es = $('exp').value.replace(/\s/g, '').replace(/\u2212/g, '-').replace(/^\+/, '');
                if (!cs || !es) return { invalid: 'Fill in both boxes: the number before \u00D7 10, and the exponent.' };
                if (!/^(\d+\.?\d*|\.\d+)$/.test(cs) || !/^-?\d+$/.test(es)) {
                    return { invalid: 'Use digits only. The exponent can start with a minus sign, like -4.' };
                }
                const c = Number.parseFloat(cs);
                const x = Number.parseInt(es, 10);
                const target = Number(p.coef);
                const val = Number(p.std);
                if (c === target && x === p.e) return { ok: true };

                let why;
                if (Math.abs(c * 10 ** x - val) <= val * 1e-9) {
                    why = `${sci(cs, x)} has the right value, but the first number must be at least 1 and less than 10.`;
                } else if (c === target && x === -p.e) {
                    why = 'The digits are right, but the exponent has the wrong sign.';
                } else if (c === target) {
                    why = `The digits are right, but the exponent is off by ${Math.abs(x - p.e)}.`;
                } else if (c < 1 || c >= 10) {
                    why = 'The first number must be at least 1 and less than 10.';
                } else {
                    why = 'The digits in your first number don\u2019t match. Keep the digits of the number, but not the zeros that only hold places.';
                }

                const hint = p.e > 0
                    ? 'This number is greater than 1, so the exponent is positive. Move the decimal point left until one nonzero digit is in front of it. The number of moves is the exponent.'
                    : 'This number is less than 1, so the exponent is negative. Move the decimal point right until one nonzero digit is in front of it. The number of moves is the size of the exponent.';
                return { ok: false, why, hint };
            };

            const normStd = (s) => {
                s = s.replace(/[,\s]/g, '');
                if (!/^(\d+\.?\d*|\.\d+)$/.test(s)) return null;
                const [ip, fp = ''] = s.split('.');
                let a = ip.replace(/^0+(?=\d)/, '');
                const b = fp.replace(/0+$/, '');
                if (a === '') a = '0';
                return b ? `${a}.${b}` : a;
            };

            // Validate user input for "Standard Form" questions
            const checkStd = (p) => {
                const raw = $('std').value;
                if (!raw.trim()) return { invalid: 'Type the number first.' };
                const u = normStd(raw);
                if (u === null) return { invalid: 'Use digits and a decimal point only. Commas are fine.' };
                if (u === p.std) return { ok: true };

                const sig = (s) => s.replace('.', '').replace(/^0+/, '').replace(/0+$/, '');
                let why;
                if (sig(u) === sig(p.std)) {
                    const off = Math.round(Math.log(Number.parseFloat(u) / Number.parseFloat(p.std)) / Math.LN10);
                    why = `The digits are right, but your decimal point is ${plural(Math.abs(off))} too far ${off > 0 ? 'right' : 'left'}.`;
                } else {
                    why = 'The digits don\u2019t match. Start with the digits of the first number, then move the decimal point. Zeros only fill empty places.';
                }

                const n = Math.abs(p.e);
                const hint = p.e > 0
                    ? `The exponent is positive (${p.e}), so move the decimal point ${plural(n)} to the right. Add zeros when you run out of digits.`
                    : `The exponent is negative (${sg(p.e)}), so move the decimal point ${plural(n)} to the left. Add zeros in the empty places.`;
                return { ok: false, why, hint };
            };

            // Validate user choice for "Multiple Choice" questions
            const checkMc = (p) => {
                if (picked === null) return { invalid: 'Choose one of the four options.' };
                const o = p.opts[picked];
                if (o.ok) return { ok: true };
                return {
                    ok: false,
                    why: o.why,
                    hint: 'Proper scientific notation starts with a number from 1 up to (but not including) 10. Big numbers have positive exponents; small numbers have negative ones.',
                };
            };

            // Generate explanations and praise messages for answers
            const explain = (p) => {
                const n = Math.abs(p.e);
                if (p.type === 'sci') {
                    return `Move the decimal point ${plural(n)} ${p.e > 0 ? 'left' : 'right'} to get ${p.coef}. ${p.e > 0 ? 'A large number' : 'A number less than 1'} gets a ${p.e > 0 ? 'positive' : 'negative'} exponent: ${sg(p.e)}.`;
                }
                if (p.type === 'std') {
                    return `The exponent ${sg(p.e)} means move the decimal point ${plural(n)} to the ${p.e > 0 ? 'right' : 'left'}, which gives ${fmt(p.std)}.`;
                }
                return `${p.coef} is between 1 and 10, and the exponent ${sg(p.e)} fits a ${p.e > 0 ? 'large' : 'small'} number.`;
            };

            const answerText = (p) => (p.type === 'std' ? fmt(p.std) : sci(p.coef, p.e));
            const praise = ['Correct!', 'Nice work!', 'Exactly right!', 'Yes!'];

            // Lock input fields and options once a question is completed or failed
            const lock = (p, good, reveal) => {
                card.querySelectorAll('input').forEach((el) => { el.disabled = true; });
                if (p.type === 'mc') {
                    const opts = card.querySelectorAll('.opt');
                    opts.forEach((o) => { o.disabled = true; });
                    if (good || reveal) {
                        p.opts.forEach((o, k) => { if (o.ok) opts[k].classList.add('right'); });
                    }
                }
            };

            // Main check handler when user submits an answer
            const check = () => {
                interacted = true;
                const p = set[i];
                const r = p.type === 'sci' ? checkSci(p) : p.type === 'std' ? checkStd(p) : checkMc(p);
                if (r.invalid) {
                    fb('note', r.invalid);
                    return;
                }
                tries++;

                if (r.ok) {
                    status[i] = 'ok';
                    card.querySelectorAll('input').forEach((el) => el.classList.add('right'));
                    lock(p, true);
                    fb('ok', `<b>${tries === 1 ? praise[rnd(0, praise.length - 1)] : 'Correct on your second try.'}</b> ${explain(p)}`);
                    finish();
                } else if (tries === 1) {
                    card.querySelectorAll('input').forEach((el) => el.classList.add('wrong'));
                    if (p.type === 'mc') {
                        const chosen = card.querySelectorAll('.opt')[picked];
                        chosen.classList.add('wrong');
                        chosen.disabled = true;
                        chosen.setAttribute('aria-checked', 'false');
                        picked = null;
                        primary.disabled = true;
                    } else {
                        const f = $('coef') || $('std');
                        f.focus();
                        f.select();
                    }
                    head();
                    fb('bad', `<b>Not quite.</b> ${r.why}`, r.hint);
                } else {
                    status[i] = 'miss';
                    card.querySelectorAll('input').forEach((el) => el.classList.add('wrong'));
                    if (p.type === 'mc') card.querySelectorAll('.opt')[picked].classList.add('wrong');
                    lock(p, false, true);
                    fb('bad', `<b>The answer is ${answerText(p)}.</b> ${explain(p)}`);
                    finish();
                }
            };

            // ==========================================
            // 7. QUIZ FLOW, REVIEW, & COMPLETION
            // ==========================================
            const finish = () => {
                phase = 'reveal';
                primary.disabled = false;
                primary.textContent = i === TOTAL - 1 ? 'See results' : 'Next question';
                head();
                primary.focus();
            };

            const next = () => {
                if (i === TOTAL - 1) {
                    done();
                    return;
                }
                i++;
                showQ();
            };

            // Generate a review summary of missed questions at the end of the set
            const review = () => {
                const miss = set.filter((p, k) => status[k] === 'miss');
                if (!miss.length) return '';
                return `<div class="review"><b>Review these</b><ul>${miss
                    .map((p) => {
                        const n = Math.abs(p.e);
                        let eq, tip;
                        if (p.type === 'sci') {
                            eq = `${fmt(p.std)} = ${sci(p.coef, p.e)}`;
                            tip = `Move the decimal point ${n} ${p.e > 0 ? 'left' : 'right'}, so the exponent is ${sg(p.e)}.`;
                        } else if (p.type === 'std') {
                            eq = `${sci(p.coef, p.e)} = ${fmt(p.std)}`;
                            tip = `Exponent ${sg(p.e)} means move the decimal point ${n} ${p.e > 0 ? 'right' : 'left'}.`;
                        } else {
                            eq = `${fmt(p.std)} = ${sci(p.coef, p.e)}`;
                            tip = `The first number is 1 to under 10, and ${p.e > 0 ? 'large' : 'small'} numbers get ${p.e > 0 ? 'positive' : 'negative'} exponents.`;
                        }
                        return `<li><span class="eq">${eq}</span><span class="rtip">${tip}</span></li>`;
                    })
                    .join('')}</ul></div>`;
            };

            // Handle end-of-set results and score summaries
            const done = () => {
                phase = 'done';
                const s = score();
                const msg =
                    s === TOTAL ? 'Perfect set! Every answer right.' :
                        s >= TOTAL * 0.8 ? 'Strong work. Check the review below.' :
                            s >= TOTAL * 0.6 ? 'Good progress. Review the problems below.' :
                                'Keep practicing. Review the problems below.';
                const rv = review();
                card.className = rv ? 'done' : '';
                card.innerHTML = rv
                    ? `<div class="sum"><div class="final">${s}<small> / ${TOTAL}</small></div><p class="prompt">${msg}</p></div>${rv}`
                    : `<div class="final">${s}<small> / ${TOTAL}</small></div><p class="prompt">${msg}</p>`;
                fb('tip', `Ready for more? A new set has ${TOTAL} fresh problems.`);
                if (rv) $('fb').className = 'fb gone';
                primary.textContent = 'Start a new set';
                primary.disabled = false;
                head();
                primary.focus();
            };

            // ==========================================
            // 8. EVENT LISTENERS & INITIALIZATION
            // ==========================================
            // Main action button click listener
            primary.addEventListener('click', () => {
                interacted = true;
                if (phase === 'done') startSet();
                else if (phase === 'reveal') next();
                else check();
            });

            // Allow pressing 'Enter' on the keyboard to submit answers
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && e.target.tagName !== 'BUTTON') {
                    e.preventDefault();
                    if (!primary.disabled) primary.click();
                }
            });

            // Kick off the very first question set on script load
            startSet();
        })();
    </script>
</body>
