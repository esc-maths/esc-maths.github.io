<!doctype html>
<html lang="en">

<head>
	<meta charset="utf-8">

	<title>Maths Slides - Template</title>

	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

	<link rel="stylesheet" href="../revealjs-5-2/dist/reveal.css">
	<link rel="stylesheet" href="../revealjs-5-2/dist/theme/white.css" id="theme">
	<link rel="stylesheet" href="../revealjs-5-2/third-party-plugin/chalkboard/style.css">
	<link rel="stylesheet" href="../revealjs-5-2/third-party-plugin/customcontrols/style.css">

	<link rel="stylesheet" href="mySetup/mylayout.css" />

	<!-- Code syntax highlighting https://revealjs.com/-->
	<link rel="stylesheet" href="../revealjs-5-2/plugin/highlight/zenburn.css">

	<link rel="icon" type="image/png" href="images/icon/infinity32.png" sizes="32x32">
	<link rel="icon" type="image/png" href="images/icon/infinity16.png" sizes="16x16">

	<!-- Printing and PDF exports -->
	<script>
		var link = document.createElement('link');
		link.rel = 'stylesheet';
		link.type = 'text/css';
		link.href = window.location.search.match(/print-pdf/gi) ? 'export/pdf.css' :
			'export/paper.css';
		document.getElementsByTagName('head')[0].appendChild(link);
	</script>


	<!-- This script is to display Github buttons -->
	<script async defer src="mySetup/buttons.js"></script>

	<!--[if lt IE 9]>
		<script src="../reveal.js/lib/js/html5shiv.js"></script>
		<![endif]-->


</head>

<body>
	<div class="reveal">
		<div class="slides">

			<!-- Any section element inside of this container is displayed as a slide -->
			<section>

				<div style="margin-bottom: 10px;">
					<img src="../../assets/gu-logo/Griffith-logo-black.png"
						style="width: 150px; vertical-align: middle; border: 0px solid rgb(255, 255, 255);">
				</div>

				<div class="size-85">
					<h2>Quantitative Reasoning</h2>
					<p style="font-weight: bold; font-size: 130%;">1015SCG</p>
				</div>
				<p style="font-size: 90%;">Lecture 1</p>

				<div style="margin-top: -20px;">
					<img style="width: 400px;" src="../../assets/cesaro-fractal/cesaro-01.png">
				</div>
				<br />
			</section>


			<!-- Ends sections -->

		</div>
	</div>


	<script src="../revealjs-5-2/dist/reveal.js"></script>
	<script src="../revealjs-5-2/plugin/math/math.js"></script>
	<script src="../revealjs-5-2/plugin/highlight/highlight.js"></script>
	<script src="../revealjs-5-2/plugin/zoom/zoom.js"></script>
	<script src="../revealjs-5-2/plugin/search/search.js"></script>
	<script src="../revealjs-5-2/third-party-plugin/chalkboard/plugin.js"></script>
	<script src="../revealjs-5-2/third-party-plugin/customcontrols/plugin.js"></script>
	<script src="../revealjs-5-2/third-party-plugin/menu/menu.js"></script>
	<script src="mySetup/setup.js"></script>

	<script>
		includeHTML();
	</script>


</body>

</html>
