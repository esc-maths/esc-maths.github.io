<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ESC Maths - Contents</title>

  <link rel="icon" type="image/png" href="assets/icon/infinity32.png" sizes="32x32">
  <link rel="icon" type="image/png" href="assets/icon/infinity16.png" sizes="16x16">

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
    }

    iframe {
      width: 100vw;
      height: 100vh;
      border: none;
      display: block;
    }

    body {
      margin: 0;
      background-color: #000;
      color: #fff;
      font-family: Monospace;
      font-size: 1rem;
      line-height: 2em;
      overscroll-behavior: none;

      position: relative;
      /* key for absolute children */
      height: 100vh;
      overflow: hidden;
    }

    a,
    button,
    input,
    select {
      pointer-events: auto;
    }

    a {
      text-decoration: none;
      color: aqua;
    }

    /* Bottom centered credit box */
    .credit {
      position: absolute;
      bottom: 1rem;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.85);
      color: #fff;
      padding: 0.4rem 0.9rem;
      font-size: 0.85rem;
      border-radius: 0.5rem;
      letter-spacing: 0.05em;
      z-index: 20;
      pointer-events: none;
      /* so it doesn't block iframe clicks */
    }



    /* Overlay card */
    .card {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background-color: rgba(0, 0, 0, 0.9);
      color: white;
      padding: 1.5rem;
      border-radius: 1rem;
      box-shadow: 0 8px 24px rgba(255, 255, 255, 0.1);
      width: 50%;
      max-width: 500px;
      text-align: center;
      z-index: 10;
      pointer-events: auto;
    }

    .card li {
      text-align: left;
    }

    .card a {
      color: rgb(255, 255, 255);
    }

    .card a:hover {
      color: rgb(119, 230, 255);
    }

    .countdown-container {
      margin: 1rem 0;
    }

    .countdown-container p {
      margin-bottom: 0.3rem;
      font-size: 1rem;
      color: #aaa;
    }

    #countdown {
      font-size: 2.5rem;
      font-weight: bold;
      letter-spacing: 0.08em;
      color: aqua;
      font-variant-numeric: tabular-nums;
    }

    @media screen and (max-width: 600px) {
      #countdown {
        font-size: 2rem;
      }
    }

    /* Responsive adjustments for smaller devices */
    @media screen and (max-width: 768px) {
      body {
        font-size: 1rem;
        /* Slightly smaller font for mobile */
        line-height: 1.6em;
        /* Tighter line height */
      }

      .card {
        width: 90%;
        /* Wider relative width on mobile */
        padding: 1rem;
        /* Less padding */
        border-radius: 0.8rem;
        /* Slightly smaller radius */
      }
    }

    /* Extra small devices (phones, 600px and down) */
    @media screen and (max-width: 600px) {
      body {
        font-size: 0.7rem;
        /* Even smaller font for very small screens */
      }

      .card {
        width: 75%;
        /* Nearly full width on very small screens */
        max-width: none;
        /* Override the max-width on smallest screens */
        padding: 0.8rem;
        /* Minimal padding */
      }

      .credit {
        display: none;
      }
    }
  </style>

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-8GQQBCYTB5"></script>

    window.dataLayer = window.dataLayer || [];

</head>

<body>


  <iframe id="randomFrame"></iframe>

  <div class="card">
    <h1>Quantitative Reasoning</h1>

    <h2>1015SCG</h2>

    <picture>
      <source srcset="https://fonts.gstatic.com/s/e/notoemoji/latest/1f47e/512.webp" type="image/webp">
      <img src="https://fonts.gstatic.com/s/e/notoemoji/latest/1f47e/512.gif" alt="👾" width="32" height="32">
    </picture>

    <div class="countdown-container">
      <p>Lecture starts in</p>
      <div id="countdown">00:00:00</div>
    </div>


  </div>


  <script>
    const links = [
      "../../sketches/black-hole-bruno",
      "../../sketches/noise-rings",
      "../../sketches/one-million-pi-digits",
      "../../sketches/fun-code",
      "../../sketches/escher-infinite-frame",
      "https://www.dynamicmath.xyz/threejs/dodecahedron-fractal/",
      "https://www.dynamicmath.xyz/sketches/matrixrain/",
      "https://www.dynamicmath.xyz/sketches/dragon-curve-bezier",
      "https://www.dynamicmath.xyz/sketches/flow-field-noise",
      "https://vector-calculus.github.io/applets/threejs/gravity/",
      "https://geometria-hiperbolica.github.io/sketches/octahedralis/",
      "../../sketches/particle-life/webgpu",
      "../../sketches/curve-shapes-tsl",
      "../../sketches/dawn-sea",
      "https://www.dynamicmath.xyz/sketches/lean-proof",

    ];

    // Pick a random link
    const randomLink = links[Math.floor(Math.random() * links.length)];

    // Set iframe source
    document.getElementById("randomFrame").src = randomLink;

  </script>

  <script>
    function updateCountdown() {
      const now = new Date();

      // Set target to N:00 pm/am today (e.g. 5 pm -> 17)
      const target = new Date();
      target.setHours(10, 0, 0, 0);

      // If N pm/am has passed, target N pm/am tomorrow
      if (now >= target) {
        target.setDate(target.getDate() + 1);
      }

      const difference = target - now;

      const hours = Math.floor(difference / (1000 * 60 * 60));
      const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((difference % (1000 * 60)) / 1000);

      const format = value => String(value).padStart(2, '0');

      document.getElementById("countdown").textContent =
        `${format(hours)}:${format(minutes)}:${format(seconds)}`;
    }

    updateCountdown();
    setInterval(updateCountdown, 1000);
  </script>

</body>

</html>
