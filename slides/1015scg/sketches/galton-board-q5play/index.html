<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <link rel="stylesheet" type="text/css" href="style.css">

    <script type="module" src="https://q5js.org/q5.js"></script>

    <script type="importmap">
        { "imports": {
             "box2d3-wasm": "https://q5play.org/Box2D.deluxe.mjs"
            } 
        }
    </script>
    <script type="module" src="https://q5play.org/q5play.js?4"></script>


    <script type="module" src="mySketch.js"></script>
</head>

<body>

    <!-- Loader -->
    <div id="loader">
        <div class="spinner"></div>
        <div class="loading-text">Loading Sketch...</div>
    </div>



    <script>
        /* Simulate loading */
        window.addEventListener("load", () => {
            setTimeout(() => {
                document.getElementById("loader")
                    .classList.add("loader-hidden");
            }, 500);
        });
    </script>

</body>

</html>
