<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- keep the line below for OpenProcessing compatibility -->

  <script src="https://cdn.jsdelivr.net/npm/p5@1.11.8/lib/p5.min.js"></script>

  <link rel="icon" type="image/png" href="../icon/infinity32.png" sizes="32x32">
  <link rel="icon" type="image/png" href="../icon/infinity16.png" sizes="16x16">

  <link rel="stylesheet" type="text/css" href="style.css">

  <title>3D geometric shapes</title>

  

</head>

<body>

  <script src="sketch.js"></script>

  <script>
    // Function to toggle full screen mode
    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => {
          console.error(`Error attempting to enable full-screen mode: ${err.message} (${err.name})`);
        });
      } else {
        document.exitFullscreen();
      }
    }

    // Event listener for keydown event
    document.addEventListener('keydown', (event) => {
      if (event.key === 'f' || event.key === 'F') {
        toggleFullScreen();
      }
    });
  </script>

</body>

</html>
