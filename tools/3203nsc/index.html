<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam Question Generator</title>

    <link rel="stylesheet" href="style.css">
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-8GQQBCYTB5"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());

        gtag('config', 'G-8GQQBCYTB5');
    </script>
</head>

<body>

    <div class="container">
        <h1>🎓 Exam Prep</h1>
        <p class="subtitle">Select the student's electives to generate a question.</p>

        <div class="electives" id="electives"></div>

        <div class="button-group">
            <button id="genBtn" class="btn-generate" onclick="generateQuestion()">
                Generate Question
            </button>
            <button id="resetBtn" class="btn-reset" onclick="resetApp()">
                Restart
            </button>
        </div>

        <div class="warning" id="warning"></div>

        <div class="result" id="result">
            <div class="card">
                <div class="topic" id="topic"></div>
                <div class="problem" id="problem"></div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>

</body>

</html>
