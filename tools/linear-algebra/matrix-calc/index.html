<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="../../assets/icon/infinity32.png" sizes="32x32">
    <link rel="icon" type="image/png" href="../../assets/icon/infinity16.png" sizes="16x16">

    <title>Matrix Calculator</title>

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-8GQQBCYTB5"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());

        gtag('config', 'G-8GQQBCYTB5');
    </script>

    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 1.1rem;
            margin: 20px;
            background: #f4f4f9;
            color: #333;
            padding: 0rem 2rem 1rem 2rem;
        }

        h1 {
            text-align: center;
            color: #222;
        }

        .matrix-input {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin: 20px 0;
        }

        .input-group {
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        }

        .input-group h3 {
            margin-top: 0;
            color: #4061a7;
        }

        button {
            margin: 5px;
            padding: 10px 18px;
            border: none;
            background: #389dc7;
            color: white;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: background 0.2s ease;
        }

        button:hover {
            background: #4061a7;
        }

        .copy-btn {
            background: #28a745;
            padding: 6px 12px;
            font-size: 0.85rem;
            margin-top: 8px;
        }

        .copy-btn:hover {
            background: #218838;
        }

        textarea {
            width: 100%;
            height: 120px;
            margin-top: 5px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 1rem;
            box-sizing: border-box;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            resize: vertical;
        }

        #result-container {
            margin: 30px auto;
            padding: 20px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
            width: fit-content;
            min-width: 300px;
            text-align: center;
        }

        .result-title {
            font-weight: bold;
            margin-bottom: 10px;
            color: #555;
        }

        .plain-output-wrapper {
            margin-top: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .copyable-text {
            width: 100%;
            max-width: 400px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.95rem;
            background: #f8f9fa;
            padding: 12px;
            border-radius: 4px;
            border: 1px dashed #ccc;
            white-space: pre-wrap;
            text-align: left;
            user-select: all;
            box-sizing: border-box;
        }

        footer {
            padding-top: 1.5rem;
            text-align: center;
        }
    </style>
</head>

<body>
    <h1>Matrix Calculator</h1>

    <div class="matrix-input">
        <div class="input-group">
            <h3>Matrix A</h3>
            <textarea id="matrixA_text" placeholder="Enter values separated by spaces and lines">1 2 3
1/2 2 3
4 5 6</textarea>
        </div>
        <div class="input-group">
            <h3>Matrix B</h3>
            <textarea id="matrixB_text" placeholder="Enter values separated by spaces and lines">1 0 0
0 1 0
0 0 1</textarea>
        </div>
    </div>

    <div style="text-align:center; margin-bottom: 20px;">
        <button onclick="handleAction('add')">A + B</button>
        <button onclick="handleAction('sub')">A - B</button>
        <button onclick="calculate('mul')">A × B</button>
        <button onclick="calculate('detA')">det(A)</button>
        <button onclick="calculate('detB')">det(B)</button>
        <button onclick="calculate('transA')">Aᵀ</button>
        <button onclick="calculate('transB')">Bᵀ</button>
        <button onclick="calculate('invA')">A⁻¹</button>
        <button onclick="calculate('invB')">B⁻¹</button>
    </div>

    <div id="result-container" style="display: none;">
        <div class="result-title" id="result-label">Result:</div>
        <div id="mathjax-output"></div>

        <div class="plain-output-wrapper">
            <div class="copyable-text" id="plain-output" title="Click or double-click to select all plain text"></div>
            <button class="copy-btn" id="copy-button" onclick="copyToClipboard()">Copy Plain Text</button>
        </div>
    </div>

    <footer>
        <p>\( \huge \infty \)</p>
    </footer>

    <script>
        function parseFraction(str) {
            str = str.trim();
            if (str.includes('/')) {
                let parts = str.split('/');
                if (parts.length === 2) {
                    let num = parseFloat(parts[0]);
                    let den = parseFloat(parts[1]);
                    if (!isNaN(num) && !isNaN(den) && den !== 0) {
                        return num / den;
                    }
                }
            }
            return parseFloat(str);
        }

        function readMatrix(id) {
            let text = document.getElementById(id + '_text').value.trim();
            if (!text) return null;

            let rows = text.split(/\n/).map(line =>
                line.trim().split(/\s+/).map(parseFraction)
            );

            let colCount = rows[0].length;
            for (let i = 0; i < rows.length; i++) {
                if (rows[i].length !== colCount || rows[i].some(isNaN)) {
                    alert(`Error parsing ${id === 'matrixA' ? 'Matrix A' : 'Matrix B'}. Please ensure all rows have equal lengths and contain valid numbers.`);
                    return null;
                }
            }
            return rows;
        }

        function formatNumber(num) {
            let rounded = Math.round(num * 10000) / 10000;
            return Number.isInteger(rounded) ? rounded.toString() : parseFloat(rounded.toString()).toString();
        }

        function displayOutput(label, matrixOrValue) {
            const container = document.getElementById('result-container');
            const labelElem = document.getElementById('result-label');
            const mathOutput = document.getElementById('mathjax-output');
            const plainOutput = document.getElementById('plain-output');
            const copyBtn = document.getElementById('copy-button');

            labelElem.innerText = label;
            container.style.display = "block";
            copyBtn.innerText = "Copy Plain Text";

            if (!Array.isArray(matrixOrValue)) {
                let formattedVal = formatNumber(matrixOrValue);
                mathOutput.innerHTML = `\\[ ${formattedVal} \\]`;
                plainOutput.innerText = formattedVal;
            } else {
                let matrix = matrixOrValue;

                // 1. Build LaTeX MathJax
                let latex = '\\[ \\begin{pmatrix} ';
                for (let i = 0; i < matrix.length; i++) {
                    latex += matrix[i].map(formatNumber).join(' & ');
                    if (i < matrix.length - 1) latex += ' \\\\ ';
                }
                latex += ' \\end{pmatrix} \\]';
                mathOutput.innerHTML = latex;

                // 2. Build plain copyable text format: Raw line breaks and spaces
                let plainText = matrix.map(row =>
                    row.map(formatNumber).join(' ')
                ).join('\n');
                plainOutput.innerText = plainText;
            }

            if (window.MathJax && MathJax.typesetPromise) {
                MathJax.typesetPromise([mathOutput]);
            }
        }

        function copyToClipboard() {
            const textToCopy = document.getElementById('plain-output').innerText;
            const copyBtn = document.getElementById('copy-button');

            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(textToCopy).then(() => {
                    showCopiedFeedback(copyBtn);
                }).catch(err => {
                    console.error('Failed to copy text: ', err);
                });
            } else {
                const textArea = document.createElement("textarea");
                textArea.value = textToCopy;
                document.body.appendChild(textArea);
                textArea.select();
                try {
                    document.execCommand('copy');
                    showCopiedFeedback(copyBtn);
                } catch (err) {
                    console.error('Fallback copy failed', err);
                }
                document.body.removeChild(textArea);
            }
        }

        function showCopiedFeedback(btn) {
            btn.innerText = "Copied!";
            setTimeout(() => {
                btn.innerText = "Copy Plain Text";
            }, 2000);
        }

        function determinant(matrix) {
            if (matrix.length !== matrix[0].length) {
                alert('Matrix must be square to calculate determinant.');
                return null;
            }
            let n = matrix.length;
            if (n === 1) return matrix[0][0];
            if (n === 2) return matrix[0][0] * matrix[1][1] - matrix[0][1] * matrix[1][0];

            let det = 0;
            for (let j = 0; j < n; j++) {
                let sub = matrix.slice(1).map(row => row.filter((_, col) => col !== j));
                det += ((j % 2 === 0 ? 1 : -1) * matrix[0][j] * determinant(sub));
            }
            return det;
        }

        function transpose(matrix) {
            return matrix[0].map((_, i) => matrix.map(row => row[i]));
        }

        function inverse(matrix) {
            let n = matrix.length;
            if (n !== matrix[0].length) {
                alert('Matrix must be square to find its inverse.');
                return null;
            }
            let det = determinant(matrix);
            if (Math.abs(det) < 1e-9) {
                alert('Matrix is singular (determinant is 0). It has no inverse.');
                return null;
            }
            let I = matrix.map((row, i) => row.map((_, j) => i === j ? 1 : 0));
            let A = matrix.map(row => row.slice());
            for (let i = 0; i < n; i++) {
                let factor = A[i][i];
                if (Math.abs(factor) < 1e-9) {
                    let swapRow = i + 1;
                    while (swapRow < n && Math.abs(A[swapRow][i]) < 1e-9) swapRow++;
                    if (swapRow === n) return null;
                    let tempA = A[i]; A[i] = A[swapRow]; A[swapRow] = tempA;
                    let tempI = I[i]; I[i] = I[swapRow]; I[swapRow] = tempI;
                    factor = A[i][i];
                }
                for (let j = 0; j < n; j++) {
                    A[i][j] /= factor;
                    I[i][j] /= factor;
                }
                for (let k = 0; k < n; k++) {
                    if (k !== i) {
                        let f = A[k][i];
                        for (let j = 0; j < n; j++) {
                            A[k][j] -= f * A[i][j];
                            I[k][j] -= f * I[i][j];
                        }
                    }
                }
            }
            return I;
        }

        function multiply(A, B) {
            if (A[0].length !== B.length) {
                alert('Matrix Multiplication Error: Inner dimensions must agree (Columns of A must equal Rows of B).');
                return null;
            }
            let result = [];
            for (let i = 0; i < A.length; i++) {
                result[i] = [];
                for (let j = 0; j < B[0].length; j++) {
                    let sum = 0;
                    for (let k = 0; k < A[0].length; k++) {
                        sum += A[i][k] * B[k][j];
                    }
                    result[i][j] = sum;
                }
            }
            return result;
        }

        function handleAction(op) {
            let A = readMatrix('matrixA');
            let B = readMatrix('matrixB');
            if (!A || !B) return;

            if (A.length !== B.length || A[0].length !== B[0].length) {
                alert('Error: Matrices must have matching dimensions for addition or subtraction.');
                return;
            }

            let res = null;
            if (op === 'add') {
                res = A.map((row, i) => row.map((val, j) => val + B[i][j]));
                displayOutput('Result (A + B):', res);
            } else if (op === 'sub') {
                res = A.map((row, i) => row.map((val, j) => val - B[i][j]));
                displayOutput('Result (A - B):', res);
            }
        }

        function calculate(op) {
            let A = readMatrix('matrixA');
            let B = readMatrix('matrixB');

            if ((op.includes('A') && !A) || (op.includes('B') && !B)) return;

            let res = null;
            switch (op) {
                case 'mul':
                    if (!A || !B) return;
                    res = multiply(A, B);
                    if (res) displayOutput('Result (A × B):', res);
                    break;
                case 'detA':
                    res = determinant(A);
                    if (res !== null) displayOutput('det(A):', res);
                    break;
                case 'detB':
                    res = determinant(B);
                    if (res !== null) displayOutput('det(B):', res);
                    break;
                case 'transA':
                    displayOutput('Transpose (Aᵀ):', transpose(A));
                    break;
                case 'transB':
                    displayOutput('Transpose (Bᵀ):', transpose(B));
                    break;
                case 'invA':
                    res = inverse(A);
                    if (res) displayOutput('Inverse (A⁻¹):', res);
                    break;
                case 'invB':
                    res = inverse(B);
                    if (res) displayOutput('Inverse (B⁻¹):', res);
                    break;
            }
        }
    </script>
</body>

</html>
